# ElotecraftDuels settings. Text lives in messages.yml and menu layouts in menus.yml.
# Durations use d/h/m/s, e.g. 30s, 5m or 1m30s. Apply changes with /duels reload;
# the database section needs a restart.

database:
  type: sqlite            # sqlite or mysql
  file: duels.db          # sqlite only
  host: localhost         # mysql only, as are the keys below
  port: 3306
  name: duels
  user: minecraft
  password: ""
  pool-size: 10

match:
  countdown-seconds: 5    # 1 to 30; fighters cannot move until it ends
  max-duration: 5m        # the fight ends in a draw after this
  end-delay-seconds: 4    # 0 to 30; time to celebrate before everyone is sent back
  round-delay-seconds: 3  # 1 to 30; pause after a round of a rounds-to-win kit, before the next countdown
  boss-bar: true          # show the time left during the fight
  boss-bar-color: RED     # PINK, BLUE, RED, GREEN, YELLOW, PURPLE or WHITE
  log-results: true       # write every result to the console
  arrow-health: true      # tell archers how much health their arrow left the target

requests:
  expiry: 30s             # how long a duel request can be accepted
  cooldown: 5s            # between requests sent by one player; duels.bypass.cooldown skips it
  rematch-window: 30s     # how long after a duel /duel rematch works

rules:
  # hunger, natural-regeneration, void-eliminates and parties.friendly-fire are defaults: a kit can set its
  # own with /duels kit rule <kit> <rule> <value>, along with fall damage, pearl cooldown and more.
  hunger: false                # false keeps food full while dueling
  natural-regeneration: true   # false: only potions, golden apples and the like heal
  # Commands fighters and spectators may use besides /duel (their aliases too), without the slash.
  # duels.bypass.commands (operators by default) allows every command.
  allowed-commands: [msg, tell, w, r, reply]
  # true: a fighter who falls out of the bottom of the arena's box loses, as in the void. Leaving any other
  # way sends them back to their spawn.
  void-eliminates: true

build:
  # Build kits (/duels kit build) let fighters place blocks in the arena and break the ones placed during
  # the duel. true also lets them break the arena itself. Everything is put back after the duel.
  break-arena-blocks: false

regen:
  blocks-per-tick: 2000   # 1 to 100000 blocks put back per tick after a build duel; the arena takes no duel until done

arenas:
  # An empty void world for arena copies and imported schematics, away from the lobby. Created at start
  # if missing; restart to apply a new name.
  world: duels_arenas
  # When every arena a duel could use is busy, WorldEdit pastes a copy of one from its snapshot
  # (/duels arena snapshot) in the arenas world. Copies come and go with the players.
  pool:
    spacing: 64           # 16 to 1024 empty blocks between copies
    max-copies: 32        # 0 to 256 copies per arena at once; 0 hosts one duel at a time in each arena
    warm: 1               # 0 to 16 free places kept ready per arena (the arena itself counts while free)
    idle-timeout: 2m      # at least 10s; a copy free this long is removed, unless it is one of the warm places

ranked:
  # /duel ranked duels move Elo rating: the winner takes it from the loser (forfeits and quits count as
  # losses, draws change nothing). /duel queue, challenges and rematches are unranked. Everyone starts at 1000
  # in every kit, or at their rating from before ratings were per kit.
  k-factor: 32            # 1 to 100; the most rating one duel can move
  range: 100              # 0 to 5000; how far apart two queued players' ratings may be at first
  range-growth: 10        # 0 to 1000; added to the range for every second a player waits
  range-max: 1000         # 0 to 5000; the range never grows past this
  # Ranked duels a player may start a day (the server's date), counted per server; 0 for no limit.
  # Players with duels.queue.ranked.unlimited have none.
  daily-limit: 0
  # Ratings are per kit; a player's overall rating is the average of the kits they played ranked. Each
  # rating shows the highest division it reaches (MiniMessage names). Use [] to turn divisions off.
  # A division may pay a season reward when /duels season end runs, to every player whose overall rating
  # is in it then (online or not), with money (Vault) and console commands like rewards below; commands may
  # use <player>, <division>, <elo> and <season>, e.g.
  #   - {name: "<gold>Gold", min: 1150, season-reward: {money: 500, commands: ["give <player> gold_block 3"]}}
  divisions:
    - {name: "<#cd7f32>Bronze", min: 0}
    - {name: "<gray>Silver", min: 1050}
    - {name: "<gold>Gold", min: 1150}
    - {name: "<aqua>Platinum", min: 1300}
    - {name: "<blue>Diamond", min: 1450}
    - {name: "<light_purple>Master", min: 1600}

parties:
  max-size: 8             # 2 to 100 players, the leader included
  invite-expiry: 60s      # how long a party invite can be accepted
  friendly-fire: false    # whether teammates can hurt each other in party splits and party vs party

kit-editor:
  timeout: 5m             # /duel editkit ends without saving after this

# Player-hosted events (/event): the host picks the kit, arena, rules, teams and winner count while
# players join, then everyone fights once. Events never change stats or ratings.
events:
  min-players: 2          # 2 to 100; an event with fewer when its wait ends is cancelled
  max-players: 16         # 2 to 100; it starts at once when full
  wait-time: 2m           # how long players can join before it starts on its own
  announce-interval: 30s  # how often a public event is announced again while it waits
  host-cooldown: 5m       # between events hosted by one player; duels.bypass.cooldown skips it
  broadcast-result: true  # tell the whole server who won; false: only the players in it
  # Paid to each winner of a fight won by a lethal hit. Money needs Vault and an economy plugin;
  # commands run from the console and may use <winner>, <host>, <kit> and <arena>. Leave both
  # empty for no prize: the result is only announced.
  reward:
    money: 0
    commands: []
  # The border the host can turn on: it starts around the arena and closes in.
  border:
    delay: 60s            # fight time before it starts closing in
    shrink-time: 2m       # how long it takes to reach min-size
    min-size: 10          # 1 to 1000 blocks across at the end
    damage: 1.0           # 0 to 20 health a second outside it (2 = one heart)
  # Events the server hosts every day at a server time ("HH:mm"), gathering players for wait-time
  # like a player's event (messages.yml event.server-host is the host). mode: ffa, teams, tournament
  # (1v1 knockout rounds, each round's fights at once), sumo (the same, one fight at a time while
  # the others watch) or double (a tournament where a player is out after two losses). A tournament's champion gets the reward above if they won the final by a kill.
  #   - {at: "20:00", kit: sumo, mode: sumo}
  schedule: []
  # A tournament or sumo fight that ends in a draw (or is cancelled before it starts) is fought again
  # up to this many times, 0 to 10; after that, one of the two goes through at random.
  tournament-replays: 1

# A sidebar gives the player their own scoreboard, so it hides other plugins' sidebars and nametag
# teams for them while it shows. Texts are in messages.yml under sidebar.
sidebar:
  match: true             # fighters and spectators see the fight: kit, arena, time, opponents
  lobby: false            # everyone else sees their stats, rank, queue and party
  lobby-worlds: []        # worlds with the lobby sidebar; empty: every world except arenas.world
  # Fighters and spectators with the match sidebar see each player's health under their name
  # (in health points: 20 is full), then messages.yml sidebar.health-below-name.
  health-below-name: true

# Leaderboard holograms placed with /duels hologram.
holograms:
  lines: 10               # players on each board, 1 to 50

# Kits players build themselves with /duel customkit, picking items from an admin kit: the base kit.
# Custom kits take the base kit's rules, arenas, permission, rewards and effects; players use them to
# challenge someone (/duel <player> custom[:slot]) or in party fights, never in queues, events or bets.
custom-kits:
  base-kit: ""            # the kit whose items players pick from; empty: custom kits are off
  slots: 3                # custom kits each player keeps, 1 to 9
  # The name duels show; <player> is the builder, <slot> the kit's number.
  display-name: "<yellow><player>'s custom kit <slot>"

# Kit modes (/duels kit mode <kit> bridge|bed-fight). Bridge: walking into the other side's goal (set with
# /duels arena setgoal) wins a round; knocked-out fighters come back at their spawn, and placed blocks stay
# between rounds. Bed fight: knocked-out fighters come back while their bed (/duels arena setbed) stands.
modes:
  bridge:
    goal-radius: 2          # 0 to 16 blocks across (x and z) from the goal point: a flat ring at its layer to pass through
    protect-radius: 3       # no blocks placed this close to a spawn or goal, 0 to 16
    goal-hologram: true     # messages.yml match.goal-hologram above each goal

# Hotbar items in the lobby that open the queues, events, kit editor and history (menus.yml lobby-items).
# For practice servers: players' own items are never replaced, but the items take hotbar slots.
lobby-items:
  enabled: false
  worlds: []              # worlds with the items; empty: every world except arenas.world
                          # (also where players who turned "Lobby players" off see only their party)

# Money bets on duels: /duel <player> <kit> [arena] bet <amount>. Needs Vault and an economy plugin.
# Both stakes are taken when the duel is accepted; the winner gets both (less the tax), and a draw, a
# cancel or /duels stop gives them back. A forfeit or quit loses the stake. Stakes of duels a stop or
# crash cut short are given back when the server starts again.
bets:
  enabled: true
  min: 10                 # each player's stake, 0.01 to 1000000000
  max: 100000
  tax: 0                  # percent of the pot the server keeps, 0 to 100

rewards:
  # Money needs Vault and an economy plugin. Commands run from the console and may use
  # <winner>, <loser>, <kit> and <arena>, e.g. "give <winner> diamond 1". Only paid for a lethal hit:
  # forfeits, quits and draws give nothing.
  win:
    money: 0
    commands: []
  loss:
    money: 0
    commands: []

titles:                   # ticks (20 ticks = 1 second)
  fade-in: 5
  stay: 30
  fade-out: 10

# Sounds use Minecraft sound ids (https://minecraft.wiki/w/Sounds.json), e.g. entity.player.levelup.
# Particles use Bukkit names of particles that need no extra data, e.g. TOTEM_OF_UNDYING, FLAME, HEART.
# Remove an entry, or one of its keys, to turn that part off.
effects:
  request-received: {sound: entity.experience_orb.pickup, volume: 1.0, pitch: 1.2}
  countdown: {sound: block.note_block.hat, volume: 1.0, pitch: 1.0}
  fight-start: {sound: entity.ender_dragon.growl, volume: 0.6, pitch: 1.6}
  round-won: {sound: entity.player.levelup, volume: 0.8, pitch: 1.2}
  victory: {sound: ui.toast.challenge_complete, volume: 1.0, pitch: 1.0, particle: TOTEM_OF_UNDYING, count: 60}
  defeat: {sound: entity.wither.death, volume: 0.5, pitch: 1.6, particle: LARGE_SMOKE, count: 30}
  draw: {sound: block.note_block.bass, volume: 1.0, pitch: 0.8}
  queue-join: {sound: block.note_block.pling, volume: 0.8, pitch: 1.4}
  menu-click: {sound: ui.button.click, volume: 0.6, pitch: 1.2}
  denied: {sound: entity.villager.no, volume: 0.8, pitch: 1.0}

# Kill effects and kill messages players pick with /duel cosmetics. They play when the player who picked one
# knocks out an opponent they hit last, with a lethal hit or into the void. Each one has an icon and a name
# for the menu, and an optional permission (none: everyone may pick it). Kill effects play where the
# opponent fell: lightning is a harmless strike (its thunder is heard by every player close enough to
# see it, in other arenas too, so drop it if arenas are close), and a sound and particle work as in
# effects above, the sound heard by everyone in the fight. A kill message's text is messages.yml kill-messages.<id>.
cosmetics:
  kill-effects:
    lightning: {icon: LIGHTNING_ROD, name: "<yellow>Lightning", lightning: true}
    hearts: {icon: RED_DYE, name: "<red>Hearts", particle: HEART, count: 25, sound: entity.player.levelup, pitch: 1.6}
    flames: {icon: BLAZE_POWDER, name: "<gold>Flames", particle: FLAME, count: 60, sound: item.firecharge.use}
    souls: {icon: SOUL_LANTERN, name: "<aqua>Souls", particle: SOUL, count: 40, sound: particle.soul_escape, volume: 1.5}
    totem: {icon: TOTEM_OF_UNDYING, name: "<green>Totem", particle: TOTEM_OF_UNDYING, count: 80, sound: item.totem.use, volume: 0.5}
  kill-messages:
    slain: {icon: IRON_SWORD, name: "<gray>Slain"}
    outplayed: {icon: TARGET, name: "<aqua>Outplayed"}
    sent-home: {icon: RED_BED, name: "<red>Sent home"}
    royal: {icon: GOLDEN_HELMET, name: "<gold>Royal"}

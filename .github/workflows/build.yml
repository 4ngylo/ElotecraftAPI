name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            api/target/elotecraft-api-*.jar
            example/target/elotecraft-example-*.jar
            duels/target/elotecraft-duels-*.jar
            !**/original-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-shaded.jar
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '*/target/site/jacoco/'

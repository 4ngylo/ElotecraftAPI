# Menu layouts. Text is MiniMessage, materials are Bukkit item names.
# rows counts the bottom row too (2 to 6). The bottom row holds the page arrows in its first and
# last slot; a button's slot is its position in that row (1 to 7, counting from 0 on the left).

kits:
  title: "<gradient:#ff416c:#ff4b2b><bold>⚔ Choose a kit"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # Challenges and the kit editor. One button per kit, shown with the kit's icon. <kit>, <queued> (in either
  # queue) and <dueling> are filled in. The queues have their own menus: ranked-queue and unranked-queue.
  kit:
    name: "<gradient:#f7971e:#ffd200><bold><kit>"
    # <building> says whether fighters may place blocks with the kit.
    lore:                       # when challenging someone
      - "<dark_gray>▪ <gray>In queue: <white><queued>"
      - "<dark_gray>▪ <gray>Dueling: <white><dueling>"
      - "<dark_gray>▪ <building>"
      - ""
      - "<yellow>▶ Click to choose"
      - "<gray>▶ Right-click to preview"
    edit-lore:                  # in /duel editkit
      - "<dark_gray>▪ <building>"
      - ""
      - "<yellow>▶ Click to arrange your items"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# /duel ranked: join or leave a kit's ranked queue. A kit may use <kit>, <queued> (in this queue), <fighting>
# (dueling with the kit now), <building>, and the viewer's <elo>, <division>, <wins> and <losses> in that kit
# (ranked duels only). queued-lore is for the kit whose queue the viewer is in; it glows. The rating button
# shows the overall <elo> and <division>; switch opens /duel queue. Right-click previews a kit.
ranked-queue:
  title: "<gradient:#f7971e:#ffd200><bold>⚔ Ranked queue"
  rows: 4
  filler: {material: ORANGE_STAINED_GLASS_PANE, name: " "}
  kit:
    name: "<gold><bold><kit>"
    lore:
      - ""
      - "<dark_gray>▪ <gray>Your rating: <aqua><elo></aqua> <division>"
      - "<dark_gray>▪ <gray>Ranked record: <green><wins>W</green> <red><losses>L"
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<yellow>▶ Click to join the ranked queue"
      - "<gray>▶ Right-click to preview"
    queued-lore:
      - ""
      - "<dark_gray>▪ <gray>Your rating: <aqua><elo></aqua> <division>"
      - "<dark_gray>▪ <gray>Ranked record: <green><wins>W</green> <red><losses>L"
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<green>✔ You're in the ranked queue"
      - "<red>▶ Click to leave it"
      - "<gray>▶ Right-click to preview"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  rating: {slot: 2, material: NETHER_STAR, name: "<aqua><bold>Your rating", lore: ["<gray>Overall: <aqua><elo></aqua> <division>", "<dark_gray>The average of your kit ratings"]}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}
  switch: {slot: 6, material: IRON_SWORD, name: "<green><bold>Unranked queue »", lore: ["<gray>Casual duels: no rating change"]}

# /duel queue: join or leave a kit's unranked queue. A kit may use <kit>, <queued> (in this queue),
# <fighting> and <building>. switch opens /duel ranked, shown only with the duels.queue.ranked permission.
unranked-queue:
  title: "<gradient:#56ab2f:#a8e063><bold>⚔ Unranked queue"
  rows: 4
  filler: {material: LIME_STAINED_GLASS_PANE, name: " "}
  kit:
    name: "<green><bold><kit>"
    lore:
      - ""
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<yellow>▶ Click to join the unranked queue"
      - "<gray>▶ Right-click to preview"
    queued-lore:
      - ""
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<green>✔ You're in the unranked queue"
      - "<red>▶ Click to leave it"
      - "<gray>▶ Right-click to preview"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}
  switch: {slot: 6, material: GOLDEN_SWORD, name: "<gold><bold>Ranked queue »", lore: ["<gray>Duels that move your rating"]}

# Hotbar items in the lobby, given only with config.yml lobby-items.enabled. Each has a slot (0 to 8),
# material, name and lore, the command it runs as the player when right-clicked (without the /), show
# (idle: not queued; waiting: queued or waiting for an event; always; never, to drop a default item) and
# an optional permission players need to get it. Add more the same way, e.g. one running "party info".
lobby-items:
  unranked: {slot: 0, show: idle, command: "duel queue", material: IRON_SWORD, name: "<green><bold>Unranked queue</bold> <gray>(right-click)", lore: ["<gray>Casual duels: no rating change"]}
  ranked: {slot: 1, show: idle, permission: duels.queue.ranked, command: "duel ranked", material: DIAMOND_SWORD, name: "<gold><bold>Ranked queue</bold> <gray>(right-click)", lore: ["<gray>Duels that move your rating"]}
  leave: {slot: 0, show: waiting, command: "duel leave", material: RED_DYE, name: "<red><bold>Leave the queue</bold> <gray>(right-click)"}
  events: {slot: 4, show: always, command: "event list", material: NETHER_STAR, name: "<light_purple><bold>Events</bold> <gray>(right-click)", lore: ["<gray>Join or watch a hosted event"]}
  editor: {slot: 7, show: idle, permission: duels.kit.edit, command: "duel editkit", material: BOOK, name: "<aqua><bold>Edit kits</bold> <gray>(right-click)", lore: ["<gray>Arrange your kit layouts"]}
  history: {slot: 8, show: always, permission: duels.history, command: "duel history", material: CLOCK, name: "<yellow><bold>Match history</bold> <gray>(right-click)", lore: ["<gray>Your latest duels"]}
  options: {slot: 6, show: idle, command: "duel options", material: COMPARATOR, name: "<gray><bold>Options</bold> <gray>(right-click)", lore: ["<gray>Requests, invites, sidebar, sounds"]}
  party: {slot: 2, show: idle, permission: duels.party, command: "party", material: CAKE, name: "<light_purple><bold>Party</bold> <gray>(right-click)", lore: ["<gray>Your party, or a public one to join"]}
  cosmetics: {slot: 3, show: idle, permission: duels.cosmetics, command: "duel cosmetics", material: BLAZE_POWDER, name: "<gold><bold>Cosmetics</bold> <gray>(right-click)", lore: ["<gray>Kill effects and kill messages"]}

# A kit's items, opened by right-clicking it in the kits menu: storage, hotbar, then armor and off hand.
kit-preview:
  title: "<gradient:#f7971e:#ffd200><bold><kit>"
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  back: {slot: 4, material: ARROW, name: "<yellow>« All kits"}

# /duel inventory, from the names after a fight: a fighter as the fight left them, laid out like the kit
# preview. The bottom-row buttons (slot 0 to 8) may use <player>, <health> (hearts), <food>, <effects>,
# <hits>, <combo> (longest run of hits without being hit), <thrown>, <missed> and <accuracy> (health potions).
fight-inventory:
  title: "<gradient:#4facfe:#00f2fe><bold><player>'s inventory"
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  health: {slot: 0, material: GLISTERING_MELON_SLICE, name: "<red><bold>Health", lore: ["<gray><white><health></white> ❤"]}
  food: {slot: 1, material: COOKED_BEEF, name: "<gold><bold>Food", lore: ["<gray><white><food></white>/20"]}
  effects: {slot: 2, material: BREWING_STAND, name: "<light_purple><bold>Effects", lore: ["<gray><effects>"]}
  hits: {slot: 7, material: IRON_SWORD, name: "<yellow><bold>Hits", lore: ["<gray>Landed: <white><hits>", "<gray>Longest combo: <white><combo>"]}
  potions:
    slot: 8
    material: SPLASH_POTION
    name: "<aqua><bold>Health potions"
    lore: ["<gray>Thrown: <white><thrown>", "<gray>Missed: <white><missed>", "<gray>Accuracy: <white><accuracy>"]
  values:
    none: "none"

# /duel options: each player's own switches, <value> being values.on or values.off. Remove an option's
# section to stop offering it (it then stays as the player left it, on by default).
options:
  title: "<gradient:#ff416c:#ff4b2b><bold>Options"
  rows: 3
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  values:
    "on": "<green>On"
    "off": "<red>Off"
    any: "<green>Any"
    ms: "<yellow>up to <ms> ms"
  requests:
    slot: 10
    "on": LIME_DYE
    "off": GRAY_DYE
    name: "<gold><bold>Duel requests"
    lore: ["<gray>Others may challenge you: <value>", "<dark_gray>Same as /duel toggle requests", "", "<yellow>▶ Click to switch"]
  party-invites:
    slot: 12
    "on": CAKE
    "off": GRAY_DYE
    name: "<light_purple><bold>Party invites"
    lore: ["<gray>Others may invite you: <value>", "", "<yellow>▶ Click to switch"]
  sidebar:
    slot: 14
    "on": OAK_SIGN
    "off": GRAY_DYE
    name: "<aqua><bold>Sidebar"
    lore: ["<gray>Duel sidebar shown: <value>", "", "<yellow>▶ Click to switch"]
  sounds:
    slot: 16
    "on": NOTE_BLOCK
    "off": GRAY_DYE
    name: "<green><bold>Sounds"
    lore: ["<gray>Duel sounds played to you: <value>", "", "<yellow>▶ Click to switch"]
  spectators:
    slot: 11
    "on": ENDER_EYE
    "off": GRAY_DYE
    name: "<aqua><bold>Spectators"
    lore: ["<gray>Others may watch your duels: <value>", "<dark_gray>Staff always can", "", "<yellow>▶ Click to switch"]
  lobby-players:
    slot: 13
    "on": PLAYER_HEAD
    "off": GRAY_DYE
    name: "<yellow><bold>Lobby players"
    lore: ["<gray>See other players in the lobby: <value>", "<dark_gray>Your party always shows", "", "<yellow>▶ Click to switch"]
  # The highest ping of opponents the queues pair you with; each click moves to the next choice.
  ping-range:
    slot: 15
    material: REPEATER
    name: "<green><bold>Ping range"
    lore: ["<gray>Opponents' ping: <value>", "<dark_gray>Both players' ranges must fit", "", "<yellow>▶ Click to change"]

# /duel history [player]: their latest duels, newest first. <player> in the title; each duel may use
# <opponent>, <kit>, <arena>, <time> (fight length), <ago>, <rating> (change, or values.unranked), <how>
# (values.eliminated, forfeit or quit) and <health> (the winner's hearts left).
history:
  title: "<gradient:#f7971e:#ffd200><bold><player>'s duels"
  rows: 6
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  won:
    name: "<green><bold>Won</bold> <gray>vs <white><opponent>"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Ended by <white><how></white> after <white><time>"
      - "<dark_gray>▪ <gray>Health left: <red><health>❤"
      - "<dark_gray>▪ <gray>Rating: <white><rating>"
      - ""
      - "<dark_gray><ago> ago"
  lost:
    name: "<red><bold>Lost</bold> <gray>vs <white><opponent>"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Ended by <white><how></white> after <white><time>"
      - "<dark_gray>▪ <gray>Their health left: <red><health>❤"
      - "<dark_gray>▪ <gray>Rating: <white><rating>"
      - ""
      - "<dark_gray><ago> ago"
  values:
    unranked: "unranked"
    eliminated: "a kill"
    forfeit: "a forfeit"
    quit: "a quit"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

arenas:
  title: "<gradient:#4facfe:#00f2fe><bold>⛰ Choose an arena"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # One button per ready arena, shown with the arena's icon. <arena> is filled in.
  arena:
    name: "<aqua><bold><arena>"
    lore:
      - "<dark_gray>▪ <green>Free"
      - ""
      - "<yellow>▶ Click to choose"
    busy-lore:
      - "<dark_gray>▪ <red>In use"
      - ""
      - "<gray>Pick another arena or a random one"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  random:
    slot: 3
    material: ENDER_EYE
    name: "<light_purple><bold>Random arena"
    lore: ["<gray>Any free arena", "", "<yellow>▶ Click to choose"]
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

teams:
  title: "<gradient:#ff416c:#4facfe><bold>⚔ Pick the teams"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # One head per party member, shown with the template of their team. <player> is filled in.
  red:
    name: "<red><bold><player>"
    lore:
      - "<dark_gray>▪ <red>Red team"
      - ""
      - "<yellow>▶ Click to move to blue"
  blue:
    name: "<blue><bold><player>"
    lore:
      - "<dark_gray>▪ <blue>Blue team"
      - ""
      - "<yellow>▶ Click to move to red"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  shuffle:
    slot: 2
    material: HOPPER
    name: "<light_purple><bold>Shuffle"
    lore: ["<gray>Split the party at random", "", "<yellow>▶ Click to shuffle"]
  # <red_size> and <blue_size> count each team.
  start:
    slot: 4
    material: LIME_CONCRETE
    name: "<green><bold>Start"
    lore: ["<red>Red <white><red_size></white> <dark_gray>vs</dark_gray> <blue>Blue <white><blue_size>", "", "<yellow>▶ Click to fight"]
  close: {slot: 6, material: BARRIER, name: "<red>Close"}

# /duels kit: every kit, for admins. Buttons run the /duels kit commands, so the same checks and
# messages apply; names and values are typed in chat.
kit-admin:
  title: "<gradient:#f7971e:#ffd200><bold>⚙ Kits"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # One button per kit, shown with the kit's icon. <kit>, <id>, <permission>, <building>, <items>
  # (filled slots) and <rules> (game rules changed from the default) are filled in.
  kit:
    name: "<gradient:#f7971e:#ffd200><bold><kit>"
    lore:
      - "<dark_gray>▪ <gray>Id: <white><id>"
      - "<dark_gray>▪ <gray>Permission: <white><permission>"
      - "<dark_gray>▪ <gray>Items: <white><items>"
      - "<dark_gray>▪ <gray>Rules changed: <white><rules>"
      - "<dark_gray>▪ <building>"
      - ""
      - "<yellow>▶ Click to edit"
  values:
    everyone: "<gray>everyone"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  create:
    slot: 2
    material: EMERALD
    name: "<green><bold>New kit"
    lore: ["<gray>Made from your inventory,", "<gray>armor and off hand", "", "<yellow>▶ Click and type its name"]
  defaults:
    slot: 4
    material: CHEST
    name: "<aqua><bold>Default kits"
    lore: ["<gray>Add the default kits that are missing", "", "<yellow>▶ Click to add"]
  close: {slot: 6, material: BARRIER, name: "<red>Close"}

# /duels kit <name>: one kit's settings. <kit> and <id> work everywhere; <value> is the current setting.
kit-settings:
  title: "<gradient:#f7971e:#ffd200><bold>⚙ <kit>"
  rows: 5
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  values:
    "on": "<green>On"
    "off": "<red>Off"
    everyone: "<gray>everyone"
    any: "<gray>any arena"
    vanilla: "<gray>vanilla"
    set: "<green>set for this kit"
    default: "<gray>default"
  build:
    material: BRICKS
    name: "<gold><bold>Building"
    lore: ["<gray>Fighters may place blocks: <value>", "", "<yellow>▶ Click to switch"]
  damage:
    material: IRON_SWORD
    name: "<gold><bold>Damage"
    lore: ["<gray>Hits hurt: <value>", "<dark_gray>Off: knockback only (Sumo)", "", "<yellow>▶ Click to switch"]
  # Shown with the kit's icon; the material here is not used.
  icon:
    name: "<gold><bold>Icon"
    lore: ["<gray>Shown in the kit menus", "", "<yellow>▶ Click to use the item in your hand"]
  name:
    material: NAME_TAG
    name: "<gold><bold>Display name"
    lore: ["<gray>Now: <value>", "", "<yellow>▶ Click and type a new one"]
  permission:
    material: TRIPWIRE_HOOK
    name: "<gold><bold>Permission"
    lore: ["<gray>Who may use it: <white><value>", "", "<yellow>▶ Click and type one, or none"]
  arenas:
    material: GRASS_BLOCK
    name: "<gold><bold>Arena categories"
    lore: ["<gray>Uses: <white><value>", "", "<yellow>▶ Click and type categories, or any"]
  save:
    material: WRITABLE_BOOK
    name: "<green><bold>Save items"
    lore: ["<gray>Overwrite the kit with your", "<gray>inventory, armor and off hand", "", "<yellow>▶ Click to save"]
  load:
    material: CHEST_MINECART
    name: "<aqua><bold>Load items"
    lore: ["<gray>Put the kit in your empty", "<gray>inventory to edit it", "", "<yellow>▶ Click to load"]
  delete:
    material: LAVA_BUCKET
    name: "<red><bold>Delete kit"
    lore: ["<gray>Removes the kit for good", "", "<red>▶ Shift + right-click to delete"]
  # One button per game rule. <rule>, <value> and <state> (set or default) are filled in.
  # The material shows the value: flag-on, flag-off, seconds for a number of seconds, or number.
  rule:
    flag-on: LIME_DYE
    flag-off: GRAY_DYE
    seconds: CLOCK
    number: COMPARATOR
    name: "<yellow><bold><rule>"
    flag-lore:
      - "<dark_gray>▪ <gray>Value: <value>"
      - "<dark_gray>▪ <state>"
      - ""
      - "<yellow>▶ Left-click to switch"
      - "<yellow>▶ Right-click for the default"
    seconds-lore:
      - "<dark_gray>▪ <gray>Value: <white><value>"
      - "<dark_gray>▪ <state>"
      - ""
      - "<yellow>▶ Left-click and type seconds"
      - "<yellow>▶ Right-click for the default"
    number-lore:
      - "<dark_gray>▪ <gray>Value: <white><value>"
      - "<dark_gray>▪ <state>"
      - ""
      - "<yellow>▶ Left-click and type a number"
      - "<yellow>▶ Right-click for the default"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« All kits"}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

# /duels arena: every arena built by hand, for admins (pregen copies are counted on their source).
# Buttons run the /duels arena commands, so the same checks and messages apply.
arena-admin:
  title: "<gradient:#4facfe:#00f2fe><bold>⚙ Arenas"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # One button per arena, shown with its icon. <arena>, <id>, <world>, <status>, <categories> and
  # <copies> (pregen copies) are filled in.
  arena:
    name: "<aqua><bold><arena>"
    lore:
      - "<dark_gray>▪ <gray>Id: <white><id>"
      - "<dark_gray>▪ <gray>World: <white><world>"
      - "<dark_gray>▪ <gray>Status: <status>"
      - "<dark_gray>▪ <gray>Categories: <white><categories>"
      - "<dark_gray>▪ <gray>Copies: <white><copies>"
      - ""
      - "<yellow>▶ Click to edit"
  values:
    none: "<gray>none"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  create:
    slot: 2
    material: EMERALD
    name: "<green><bold>New arena"
    lore: ["<gray>Starts where you stand", "", "<yellow>▶ Click and type its name"]
  import:
    slot: 4
    material: STRUCTURE_BLOCK
    name: "<aqua><bold>Import schematic"
    lore: ["<gray>Pasted in the arenas world", "<gray>(needs WorldEdit or FAWE)", "", "<yellow>▶ Click and type a name and file"]
  close: {slot: 6, material: BARRIER, name: "<red>Close"}

# /duels arena <name>: one arena's settings. <arena> and <id> work everywhere; <value> is the current
# setting. Point buttons use the place you stand when you click.
arena-settings:
  title: "<gradient:#4facfe:#00f2fe><bold>⚙ <arena>"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  values:
    "on": "<green>On"
    "off": "<red>Off"
    none: "<gray>none"
    not-set: "<red>not set"
  status:
    material: BOOK
    name: "<aqua><bold>Status"
    lore: ["<value>", "", "<yellow>▶ Click for details in chat"]
  enabled:
    material: LEVER
    name: "<aqua><bold>Enabled"
    lore: ["<gray>Used for duels: <value>", "", "<yellow>▶ Click to switch"]
  spawn-1:
    material: RED_BED
    name: "<aqua><bold>Spawn 1"
    lore: ["<gray>At: <white><value>", "", "<yellow>▶ Click to set where you stand"]
  spawn-2:
    material: BLUE_BED
    name: "<aqua><bold>Spawn 2"
    lore: ["<gray>At: <white><value>", "", "<yellow>▶ Click to set where you stand"]
  corner-1:
    material: OAK_FENCE
    name: "<aqua><bold>Corner 1"
    lore: ["<gray>At: <white><value>", "", "<yellow>▶ Click to set where you stand"]
  corner-2:
    material: OAK_FENCE
    name: "<aqua><bold>Corner 2"
    lore: ["<gray>At: <white><value>", "", "<yellow>▶ Click to set where you stand"]
  box:
    material: WOODEN_AXE
    name: "<aqua><bold>Box from selection"
    lore: ["<gray>Both corners from your", "<gray>WorldEdit selection", "", "<yellow>▶ Click to set"]
  spectator:
    material: ENDER_EYE
    name: "<aqua><bold>Spectator spawn"
    lore: ["<gray>At: <white><value>", "<dark_gray>Optional", "", "<yellow>▶ Click to set where you stand"]
  center:
    material: BEACON
    name: "<aqua><bold>Center"
    lore: ["<gray>At: <white><value>", "<dark_gray>Optional", "", "<yellow>▶ Click to set where you stand"]
  ffa-spawns:
    material: ARMOR_STAND
    name: "<aqua><bold>FFA spawns"
    lore: ["<gray>Spawns: <white><value>", "<dark_gray>One per player in party FFAs", "", "<yellow>▶ Click to add where you stand", "<red>▶ Shift + right-click to clear"]
  # Shown with the arena's icon; the material here is not used.
  icon:
    name: "<aqua><bold>Icon"
    lore: ["<gray>Shown in the arena menu", "", "<yellow>▶ Click to use the item in your hand"]
  name:
    material: NAME_TAG
    name: "<aqua><bold>Display name"
    lore: ["<gray>Now: <value>", "", "<yellow>▶ Click and type a new one"]
  categories:
    material: BOOKSHELF
    name: "<aqua><bold>Categories"
    lore: ["<gray>Pools: <white><value>", "", "<yellow>▶ Left-click and type one to add", "<yellow>▶ Right-click and type one to remove"]
  build-limit:
    material: SCAFFOLDING
    name: "<aqua><bold>Build limit"
    lore: ["<gray>Highest Y: <white><value>", "", "<yellow>▶ Left-click and type a Y", "<yellow>▶ Right-click for none"]
  teleport:
    material: ENDER_PEARL
    name: "<aqua><bold>Teleport"
    lore: ["<gray>Go to the spectator spawn", "", "<yellow>▶ Click to teleport"]
  snapshot:
    material: WRITABLE_BOOK
    name: "<green><bold>Save snapshot"
    lore: ["<gray>Save its blocks, to rebuild", "<gray>it after a crash", "", "<yellow>▶ Click to save"]
  reset:
    material: TNT
    name: "<red><bold>Reset blocks"
    lore: ["<gray>Put every block back", "<gray>as in the snapshot", "", "<red>▶ Shift + right-click to reset"]
  pregen:
    material: STRUCTURE_VOID
    name: "<aqua><bold>Pregen copies"
    lore: ["<gray>Copies: <white><value>", "<dark_gray>One duel each, in the arenas world", "", "<yellow>▶ Left-click and type how many", "<red>▶ Shift + right-click to remove them"]
  delete:
    material: LAVA_BUCKET
    name: "<red><bold>Delete arena"
    lore: ["<gray>Removes the arena for good", "", "<red>▶ Shift + right-click to delete"]
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« All arenas"}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}
# /event: public events gathering players, and event fights that may be watched.
events:
  title: "<gradient:#ff416c:#ff4b2b><bold>⚑ Events"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  # One host head per event to join. <host>, <kit>, <arena>, <mode>, <winners>, <players>, <max> and
  # <time> (until it starts) are filled in.
  event:
    name: "<gradient:#ff416c:#ff4b2b><bold><host>'s event"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Mode: <white><mode>"
      - "<dark_gray>▪ <gray>Players: <white><players>/<max>"
      - "<dark_gray>▪ <gray>Starts in: <white><time>"
      - ""
      - "<yellow>▶ Click to join"
  # One per event fight, shown with the kit's icon. <host>, <kit>, <arena> and <alive> are filled in.
  running:
    name: "<aqua><bold><host>'s event"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Still fighting: <white><alive>"
      - ""
      - "<yellow>▶ Click to watch"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  host:
    slot: 3
    material: NETHER_STAR
    name: "<green><bold>Host an event"
    lore: ["<gray>Pick a kit, then the rules", "", "<yellow>▶ Click to host"]
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

# /event settings: the host's event. Each button sits at its slot (0 to rows x 9 - 1). <kit>, <arena>,
# <mode>, <winners>, <players>, <min>, <max>, <time> and <rules> (rules changed) work everywhere;
# switches also get <value>, and show the on or off material.
event-settings:
  title: "<gradient:#ff416c:#ff4b2b><bold>Event Settings"
  rows: 5
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  values:
    "on": "<green>On"
    "off": "<red>Off"
  # Shown with the kit's icon; the material here is not used.
  kit:
    slot: 10
    name: "<gold><bold>Kit"
    lore: ["<gray>Now: <white><kit>", "", "<yellow>▶ Click to choose"]
  arena:
    slot: 12
    material: COMMAND_BLOCK
    name: "<aqua><bold>Arena"
    lore: ["<gray>Now: <white><arena>", "", "<yellow>▶ Click to choose"]
  rules:
    slot: 14
    material: PAPER
    name: "<yellow><bold>Rules"
    lore: ["<gray>Changed from the kit: <white><rules>", "<dark_gray>Potions, hunger, fall damage...", "", "<yellow>▶ Click to change"]
  start:
    slot: 16
    material: FIREWORK_ROCKET
    name: "<green><bold>Start now"
    lore: ["<gray>Players: <white><players>/<max> <dark_gray>(at least <min>)", "<gray>Starts on its own in <white><time>", "", "<yellow>▶ Click to start"]
  mode:
    slot: 20
    ffa: IRON_SWORD
    teams: SHIELD
    tournament: GOLDEN_SWORD
    sumo: SLIME_BALL
    double: TOTEM_OF_UNDYING
    name: "<gold><bold>Mode"
    lore: ["<gray>Now: <white><mode>", "", "<yellow>▶ Click to switch"]
  winners:
    slot: 22
    material: GOLD_INGOT
    name: "<gold><bold>Winners"
    lore: ["<gray>Last players standing who win: <white><winners>", "<dark_gray>Free for all only", "", "<yellow>▶ Left-click for more", "<yellow>▶ Right-click for fewer"]
  border:
    slot: 24
    "on": STRUCTURE_VOID
    "off": GLASS
    name: "<gold><bold>Border"
    lore: ["<gray>Closes in during the fight: <value>", "", "<yellow>▶ Click to switch"]
  public:
    slot: 28
    "on": LIME_DYE
    "off": GRAY_DYE
    name: "<green><bold>Public"
    lore: ["<gray>Announced and open to all: <value>", "<dark_gray>Off: invited players only", "", "<yellow>▶ Click to switch"]
  spectate:
    slot: 30
    "on": ENDER_EYE
    "off": INK_SAC
    name: "<aqua><bold>Spectators"
    lore: ["<gray>Others may watch: <value>", "", "<yellow>▶ Click to switch"]
  invite:
    slot: 32
    material: NAME_TAG
    name: "<light_purple><bold>Invite"
    lore: ["<gray>Let a player into a private event", "", "<yellow>▶ Click and type a name"]
  cancel:
    slot: 34
    material: BARRIER
    name: "<red><bold>Cancel event"
    lore: ["<gray>Sends everyone away", "", "<red>▶ Click to cancel"]

# The rules of the host's event. <rule>, <value> and <state> (the kit's or changed) are filled in.
event-rules:
  title: "<gradient:#ff416c:#ff4b2b><bold>Event Rules"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  values:
    "on": "<green>On"
    "off": "<red>Off"
    kit: "<gray>the kit's"
    set: "<green>set for this event"
  rule:
    flag-on: LIME_DYE
    flag-off: GRAY_DYE
    name: "<yellow><bold><rule>"
    lore:
      - "<dark_gray>▪ <gray>Value: <value>"
      - "<dark_gray>▪ <state>"
      - ""
      - "<yellow>▶ Left-click to switch"
      - "<yellow>▶ Right-click for the kit's"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« Settings"}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

# /duel cosmetics [kill-effect|kill-message]: one button per entry of config.yml cosmetics, with its icon.
# <name> is filled in; kill messages also have <preview>, the message with you as the killer. A click picks
# one, or drops it when picked; locked ones need their permission. switch opens the other menu.
kill-effect:
  title: "<gradient:#f7971e:#ffd200><bold>✦ Kill effects"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  entry:
    name: "<name>"
    lore: ["<gray>Plays where you knock out an opponent", "", "<yellow>▶ Click to pick"]
    chosen-lore: ["<green>✔ Picked", "", "<yellow>▶ Click to drop"]
    locked-lore: ["<red>✖ Locked"]
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  switch: {slot: 3, material: NAME_TAG, name: "<aqua><bold>Kill messages", lore: ["<yellow>▶ Click to open"]}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

kill-message:
  title: "<gradient:#f7971e:#ffd200><bold>✦ Kill messages"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  entry:
    name: "<name>"
    lore: ["<gray>Everyone in the fight reads:", "<preview>", "", "<yellow>▶ Click to pick"]
    chosen-lore: ["<preview>", "", "<green>✔ Picked", "<yellow>▶ Click to drop"]
    locked-lore: ["<preview>", "", "<red>✖ Locked"]
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  switch: {slot: 3, material: BLAZE_POWDER, name: "<gold><bold>Kill effects", lore: ["<yellow>▶ Click to open"]}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

# /duel spectate without a player: the fights you may watch, one button each with its kit's icon.
# <fighters>, <kit>, <arena>, <type> (values.duel, party or event), <time> (left) and <spectators>.
spectate:
  title: "<gradient:#4facfe:#00f2fe><bold>◉ Watch a fight"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  fight:
    name: "<aqua><bold><fighters>"
    lore:
      - "<dark_gray>▪ <gray><type> · <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Time left: <white><time>"
      - "<dark_gray>▪ <gray>Watching: <white><spectators>"
      - ""
      - "<yellow>▶ Click to watch"
  values:
    duel: "Duel"
    party: "Party fight"
    event: "Event"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# /duel spectate while watching a fight: a head per fighter still in it; a click takes you to them.
# <player> and <health> (health points: 20 is full) are filled in.
spectate-fighters:
  title: "<gradient:#4facfe:#00f2fe><bold>◉ Go to a fighter"
  rows: 3
  # In the inventory of everyone watching (open it with E): a click opens this menu. slot 0 to 35:
  # 0-8 the hotbar (not shown in spectator mode), 9-35 the inventory, 22 its middle.
  item:
    slot: 22
    material: COMPASS
    name: "<aqua><bold>Go to a fighter"
    lore: ["<gray>Click to pick a fighter to watch"]
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  fighter:
    name: "<aqua><bold><player>"
    lore:
      - "<dark_gray>▪ <gray>Health: <white><health>"
      - ""
      - "<yellow>▶ Click to go to them"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# /party in a party: a head per member and the party's buttons, each running a /party command. The leader
# promotes a member with a left-click and kicks them with shift + right-click. <size> and <max> work in the title.
party:
  title: "<gradient:#ff416c:#ff4b2b><bold>⚑ Party <dark_gray>(<size>/<max>)"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  leader:
    name: "<gold><bold><player></bold> <gray>(leader)"
    leader-lore: []
  member:
    name: "<white><player>"
    lore: []
    member-lore-leader: ["", "<yellow>▶ Left-click to make leader", "<red>▶ Shift + right-click to kick"]
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  invite: {slot: 1, material: WRITABLE_BOOK, name: "<green><bold>Invite", lore: ["<gray>Type a player's name in chat", "", "<yellow>▶ Click to invite"]}
  public-off: {slot: 2, material: IRON_DOOR, name: "<gray><bold>Private party", lore: ["<gray>Invites only", "", "<yellow>▶ Click to make it public (leader)"]}
  public-on: {slot: 2, material: OAK_DOOR, name: "<green><bold>Public party", lore: ["<gray>Anyone may join", "", "<yellow>▶ Click to make it private (leader)"]}
  split: {slot: 3, material: IRON_SWORD, name: "<red><bold>Split", lore: ["<gray>Two teams inside the party", "", "<yellow>▶ Click to pick a kit (leader)"]}
  ffa: {slot: 4, material: DIAMOND_SWORD, name: "<gold><bold>Free for all", lore: ["<gray>Everyone for themselves", "", "<yellow>▶ Click to pick a kit (leader)"]}
  duel: {slot: 5, material: SHIELD, name: "<aqua><bold>Party duel", lore: ["<gray>Challenge another party", "", "<yellow>▶ Click, then type its leader (leader)"]}
  leave: {slot: 6, material: OAK_BOAT, name: "<yellow><bold>Leave", lore: ["<yellow>▶ Click to leave the party"]}
  disband: {slot: 7, material: LAVA_BUCKET, name: "<red><bold>Disband", lore: ["<gray>Ends the party for everyone", "", "<red>▶ Shift + right-click (leader)"]}

# /party without a party: the public parties (/party public), a click joining one, and a button to make your own.
# <leader>, <size> and <max> work in a party's button.
party-none:
  title: "<gradient:#ff416c:#ff4b2b><bold>⚑ Public parties"
  rows: 4
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  public-party:
    name: "<white><bold><leader></bold><gray>'s party"
    lore: ["<dark_gray>▪ <gray>Members: <white><size>/<max>", "", "<yellow>▶ Click to join"]
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  create: {slot: 3, material: CAKE, name: "<green><bold>Make a party", lore: ["<gray>Then invite players, or make it public", "", "<yellow>▶ Click to make one"]}
  close: {slot: 5, material: BARRIER, name: "<red>Close"}

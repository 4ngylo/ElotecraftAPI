# Menu layouts. Text is MiniMessage, materials are Bukkit item names.
#
# Two kinds of menus:
# - List menus (kits, arenas, history...): their entries fill the middle of the menu, centered, below an
#   empty top row and between empty side columns (centered: false fills every slot from the top left
#   instead). rows counts the bottom row too (2 to 6). The bottom row holds the page arrows in its first
#   and last slot; a button's slot is its position in that row (1 to 7, counting from 0 on the left), or
#   with row: top its position in the top row (0 to 8).
# - Menus of buttons (hub, options, settings): each button sits at its slot, 0 to rows x 9 - 1.
# Buttons with a command run it as the player (without the /) when clicked, after closing the menu:
# that is how back buttons know where to go. In the hub menus, a button without one closes the menu,
# or does nothing with close: false.
# Titles are plain text: kit and arena names in them lose their colors.
#
# version 3 is the centered layout with plain titles; version 4 adds the kit editor menus. A menus.yml from an older version is moved to
# menus.v<its version>.yml (menus.v1.yml without one) and this file is written in its place.
version: 4

# /duel and /duel menu <name>: menus of buttons that run commands. Each button has a slot, material,
# name, lore, an optional command, and an optional permission players need to see it. A PLAYER_HEAD is the
# viewer's head. Add your own menus or buttons the same way; /duel menu <name> opens them.
# Every menu may use the viewer's <wins>, <losses>, <rate> (win %), <streak>, <best> (best streak),
# <elo> and <division> (overall), and <queued> (unranked queues), <ranked> (ranked queues), <fights>
# (running) and <events> (gathering players).
hub:
  main:
    title: "Duels"
    rows: 4
    buttons:
      play:
        slot: 11
        material: DIAMOND_SWORD
        name: "<gradient:#ff416c:#ff4b2b><bold>Play"
        lore: ["<gray>Queues, events and fights to watch", "", "<dark_gray>▪ <gray>Fighting now: <white><fights>", "", "<yellow>▶ Click to open"]
        command: "duel menu play"
      profile:
        slot: 13
        material: PLAYER_HEAD
        name: "<aqua><bold>Profile"
        lore: ["<gray>Your ratings and latest duels", "", "<dark_gray>▪ <gray>Rating: <aqua><elo></aqua> <division>", "<dark_gray>▪ <gray>Record: <green><wins>W</green> <red><losses>L", "", "<yellow>▶ Click to open"]
        command: "duel menu profile"
      party:
        slot: 15
        permission: duels.party
        material: CAKE
        name: "<light_purple><bold>Party"
        lore: ["<gray>Play with friends", "", "<yellow>▶ Click to open"]
        command: "party"
      kits:
        slot: 20
        material: BOOK
        name: "<gold><bold>Kits"
        lore: ["<gray>Arrange your kits or build your own", "", "<yellow>▶ Click to open"]
        command: "duel menu kits"
      cosmetics:
        slot: 22
        permission: duels.cosmetics
        material: BLAZE_POWDER
        name: "<gold><bold>Cosmetics"
        lore: ["<gray>Kill effects and kill messages", "", "<yellow>▶ Click to open"]
        command: "duel menu cosmetics"
      options:
        slot: 24
        material: COMPARATOR
        name: "<gray><bold>Options"
        lore: ["<gray>Requests, invites, sidebar, sounds", "", "<yellow>▶ Click to open"]
        command: "duel options"
      admin:
        slot: 35
        permission: duels.staff
        material: COMMAND_BLOCK
        name: "<red><bold>Admin"
        lore: ["<gray>Arenas, kits, season and more", "", "<yellow>▶ Click to open"]
        command: "duels"
      close: {slot: 31, material: BARRIER, name: "<red>Close"}

  play:
    title: "Duels › Play"
    rows: 3
    buttons:
      unranked:
        slot: 10
        permission: duels.queue
        material: IRON_SWORD
        name: "<green><bold>Unranked"
        lore: ["<gray>Casual duels: no rating change", "", "<dark_gray>▪ <gray>In queue: <white><queued>", "", "<yellow>▶ Click to pick a kit"]
        command: "duel queue"
      ranked:
        slot: 12
        permission: duels.queue.ranked
        material: DIAMOND_SWORD
        name: "<gold><bold>Ranked"
        lore: ["<gray>Duels that move your rating", "", "<dark_gray>▪ <gray>In queue: <white><ranked>", "<dark_gray>▪ <gray>Your rating: <aqua><elo></aqua> <division>", "", "<yellow>▶ Click to pick a kit"]
        command: "duel ranked"
      events:
        slot: 14
        material: NETHER_STAR
        name: "<light_purple><bold>Events"
        lore: ["<gray>Join, watch or host an event", "", "<dark_gray>▪ <gray>Open now: <white><events>", "", "<yellow>▶ Click to open"]
        command: "event"
      spectate:
        slot: 16
        permission: duels.spectate
        material: ENDER_EYE
        name: "<aqua><bold>Spectate"
        lore: ["<gray>Watch a fight", "", "<dark_gray>▪ <gray>Fighting now: <white><fights>", "", "<yellow>▶ Click to pick one"]
        command: "duel spectate"
      back: {slot: 21, material: ARROW, name: "<yellow>« Back", command: "duel"}
      close: {slot: 22, material: BARRIER, name: "<red>Close"}

  profile:
    title: "Duels › Profile"
    rows: 3
    buttons:
      ratings:
        slot: 11
        permission: duels.stats
        material: NETHER_STAR
        name: "<aqua><bold>Ratings"
        lore: ["<gray>Your rating and division in each kit", "", "<yellow>▶ Click to open"]
        command: "duel ratings"
      summary:
        slot: 13
        material: PLAYER_HEAD
        close: false
        name: "<white><bold>Your stats"
        lore:
          - "<dark_gray>▪ <gray>Rating: <aqua><elo></aqua> <division>"
          - "<dark_gray>▪ <gray>Wins: <green><wins></green> <dark_gray>·</dark_gray> <gray>Losses: <red><losses>"
          - "<dark_gray>▪ <gray>Win rate: <white><rate>%"
          - "<dark_gray>▪ <gray>Streak: <white><streak></white> <dark_gray>(best <best>)"
      history:
        slot: 15
        permission: duels.history
        material: CLOCK
        name: "<yellow><bold>Match history"
        lore: ["<gray>Your latest duels", "", "<yellow>▶ Click to open"]
        command: "duel history"
      back: {slot: 21, material: ARROW, name: "<yellow>« Back", command: "duel"}
      close: {slot: 22, material: BARRIER, name: "<red>Close"}

  kits:
    title: "Duels › Kits"
    rows: 3
    buttons:
      edit:
        slot: 12
        permission: duels.kit.edit
        material: BOOK
        name: "<aqua><bold>Edit layouts"
        lore: ["<gray>Arrange the items of a kit", "", "<yellow>▶ Click to pick a kit"]
        command: "duel editkit"
      custom:
        slot: 14
        permission: duels.kit.custom
        material: ANVIL
        name: "<gold><bold>Custom kits"
        lore: ["<gray>Build your own kits, then", "<gray>challenge with them", "", "<yellow>▶ Click to open"]
        command: "duel customkit"
      back: {slot: 21, material: ARROW, name: "<yellow>« Back", command: "duel"}
      close: {slot: 22, material: BARRIER, name: "<red>Close"}

  cosmetics:
    title: "Duels › Cosmetics"
    rows: 3
    buttons:
      kill-effect:
        slot: 12
        material: BLAZE_POWDER
        name: "<gold><bold>Kill effects"
        lore: ["<gray>Played where you knock out an opponent", "", "<yellow>▶ Click to open"]
        command: "duel cosmetics kill-effect"
      kill-message:
        slot: 14
        material: NAME_TAG
        name: "<aqua><bold>Kill messages"
        lore: ["<gray>What the fight reads when you win", "", "<yellow>▶ Click to open"]
        command: "duel cosmetics kill-message"
      back: {slot: 21, material: ARROW, name: "<yellow>« Back", command: "duel"}
      close: {slot: 22, material: BARRIER, name: "<red>Close"}

  # /duels: the admin menu, for players with duels.staff, which duels.admin grants (a menu's permission keeps it
  # from everyone else). Each button needs its own permission.
  # A button with confirm: true opens the confirm menu before running its command.
  admin:
    title: "Admin"
    rows: 4
    permission: duels.staff
    buttons:
      arenas:
        slot: 11
        permission: duels.admin.arena
        material: GRASS_BLOCK
        name: "<aqua><bold>Arenas"
        lore: ["<gray>Create and set up arenas", "", "<yellow>▶ Click to open"]
        command: "duels arena"
      kits:
        slot: 13
        permission: duels.admin.kit
        material: DIAMOND_SWORD
        name: "<gold><bold>Kits"
        lore: ["<gray>Create and edit kits", "<gray>and their game rules", "", "<yellow>▶ Click to open"]
        command: "duels kit"
      season:
        slot: 15
        permission: duels.admin.season
        material: CLOCK
        name: "<light_purple><bold>Season"
        lore: ["<white><season_name></white>: <white><season_days></white> days in", "<gray>Ends by itself: <season_auto>", "", "<yellow>▶ Click to open"]
        command: "duel menu admin-season"
      holograms:
        slot: 20
        permission: duels.admin.hologram
        material: ARMOR_STAND
        name: "<yellow><bold>Holograms"
        lore: ["<gray>Floating leaderboards", "<dark_gray>Their commands, in chat", "", "<yellow>▶ Click to show"]
        command: "duels hologram"
      ratings:
        slot: 22
        permission: duels.admin.elo
        material: NETHER_STAR
        name: "<aqua><bold>Player ratings"
        lore: ["<gray>See or change a player's rating", "<dark_gray>Their commands, in chat", "", "<yellow>▶ Click to show"]
        command: "duels elo"
      reload:
        slot: 24
        permission: duels.admin.reload
        confirm: true
        material: REPEATER
        name: "<green><bold>Reload"
        lore: ["<gray>Config, messages, menus,", "<gray>arenas and kits", "", "<yellow>▶ Click to reload"]
        command: "duels reload"
      player-menu: {slot: 30, material: ARROW, name: "<yellow>« Player menu", command: "duel"}
      close: {slot: 31, material: BARRIER, name: "<red>Close"}

  # The admin menu's season button: each button runs a /duels season command, its answer in chat. <season_name>,
  # <season_days>, <season_ends> (time left, or none) and <season_auto> (on or off) work in every hub menu.
  admin-season:
    title: "Admin › Season"
    rows: 4
    permission: duels.admin.season
    buttons:
      info:
        slot: 10
        material: BOOK
        name: "<white><bold><season_name>"
        lore: ["<gray>Running for <white><season_days></white> days", "<gray>Ends in: <white><season_ends>", "", "<yellow>▶ Click for details"]
        command: "duels season"
      list:
        slot: 11
        material: BOOKSHELF
        name: "<gold><bold>Ended seasons"
        lore: ["<gray>Dates, players and duels", "", "<yellow>▶ Click to list"]
        command: "duels season list"
      top:
        slot: 12
        material: GOLDEN_HELMET
        name: "<gold><bold>Leaderboard"
        lore: ["<gray>This season's best ratings", "", "<yellow>▶ Click to show"]
        command: "duels season top"
      divisions:
        slot: 14
        material: NETHER_STAR
        name: "<aqua><bold>Divisions"
        lore: ["<gray>Players in each division", "<gray>and the rewards to pay", "", "<yellow>▶ Click to show"]
        command: "duels season divisions"
      kits:
        slot: 15
        material: DIAMOND_SWORD
        name: "<aqua><bold>Kits played"
        lore: ["<gray>This season's most played", "<gray>ranked kits", "", "<yellow>▶ Click to show"]
        command: "duels season kits"
      preview:
        slot: 16
        material: SPYGLASS
        name: "<yellow><bold>Preview the end"
        lore: ["<gray>What ending the season now", "<gray>would archive and pay", "<dark_gray>Ends nothing", "", "<yellow>▶ Click to show"]
        permission: duels.admin.season.manage
        command: "duels season end preview"
      auto:
        slot: 22
        material: REPEATER
        name: "<light_purple><bold>Ends by itself: <season_auto>"
        lore: ["<gray>At the planned end, the season", "<gray>ends like /duels season end", "<gray>Planned end in: <white><season_ends>", "", "<yellow>▶ Click to switch"]
        permission: duels.admin.season.manage
        command: "duels season auto toggle"
      back: {slot: 30, material: ARROW, name: "<yellow>« Back", command: "duels"}
      close: {slot: 31, material: BARRIER, name: "<red>Close"}

# Asks before something that is hard to undo. <action> is the name of the button clicked.
confirm:
  title: "Are you sure?"
  rows: 3
  accept: {slot: 11, material: LIME_CONCRETE, name: "<green><bold>Confirm", lore: ["<gray><action>"]}
  what: {slot: 13, material: PAPER, name: "<action>", lore: ["<gray>This cannot be undone"]}
  deny: {slot: 15, material: RED_CONCRETE, name: "<red><bold>Cancel", lore: ["<gray>Go back"]}

# Challenges, events and the kit editor. One button per kit, shown with the kit's icon. <kit>, <queued> (in either
# queue) and <dueling> are filled in. The queues have their own menus: ranked-queue and unranked-queue.
# back is shown in the kit editor only.
kits:
  title: "Choose a kit"
  rows: 4
  kit:
    name: "<gradient:#f7971e:#ffd200><bold><kit>"
    # <building> says whether fighters may place blocks with the kit.
    lore:                       # when challenging someone
      - "<dark_gray>▪ <gray>In queue: <white><queued>"
      - "<dark_gray>▪ <gray>Dueling: <white><dueling>"
      - "<dark_gray>▪ <building>"
      - ""
      - "<yellow>▶ Click to choose"
      - "<gray>▶ Right-click to preview"
    edit-lore:                  # in /duel editkit
      - "<dark_gray>▪ <building>"
      - ""
      - "<yellow>▶ Click to arrange your items"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu kits"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# /duel ranked: join or leave a kit's ranked queue. A kit may use <kit>, <queued> (in this queue), <fighting>
# (dueling with the kit now), <building>, and the viewer's <elo>, <division>, <wins> and <losses> in that kit
# (ranked duels only). queued-lore is for the kit whose queue the viewer is in; it glows. The rating button
# shows the overall <elo> and <division>; switch opens /duel queue. Right-click previews a kit.
ranked-queue:
  title: "Play › Ranked"
  rows: 5
  kit:
    name: "<gold><bold><kit>"
    lore:
      - "<dark_gray>▪ <gray>Your rating: <aqua><elo></aqua> <division>"
      - "<dark_gray>▪ <gray>Ranked record: <green><wins>W</green> <red><losses>L"
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<yellow>▶ Click to join the queue"
      - "<gray>▶ Right-click to preview"
    queued-lore:
      - "<dark_gray>▪ <gray>Your rating: <aqua><elo></aqua> <division>"
      - "<dark_gray>▪ <gray>Ranked record: <green><wins>W</green> <red><losses>L"
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<green>✔ You're in this queue"
      - "<red>▶ Click to leave it"
      - "<gray>▶ Right-click to preview"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  rating: {row: top, slot: 4, material: NETHER_STAR, name: "<aqua><bold>Your rating", lore: ["<gray>Overall: <aqua><elo></aqua> <division>", "<dark_gray>The average of your kit ratings"]}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu play"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}
  switch: {slot: 5, material: IRON_SWORD, name: "<green><bold>Unranked »", lore: ["<gray>Casual duels: no rating change"]}

# /duel queue: join or leave a kit's unranked queue. A kit may use <kit>, <queued> (in this queue),
# <fighting> and <building>. switch opens /duel ranked, shown only with the duels.queue.ranked permission.
unranked-queue:
  title: "Play › Unranked"
  rows: 5
  kit:
    name: "<green><bold><kit>"
    lore:
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<yellow>▶ Click to join the queue"
      - "<gray>▶ Right-click to preview"
    queued-lore:
      - "<dark_gray>▪ <gray>Queued: <white><queued></white> <dark_gray>·</dark_gray> <gray>Fighting: <white><fighting>"
      - ""
      - "<green>✔ You're in this queue"
      - "<red>▶ Click to leave it"
      - "<gray>▶ Right-click to preview"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu play"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}
  switch: {slot: 5, material: GOLDEN_SWORD, name: "<gold><bold>Ranked »", lore: ["<gray>Duels that move your rating"]}

# /duel ratings: the viewer's rating in each kit they played ranked, with its icon. <kit>, <elo>, <peak>,
# <division>, <wins> and <losses> are filled in. The overall button shows the overall <elo> and <division>.
ratings:
  title: "Profile › Ratings"
  rows: 4
  kit:
    name: "<gold><bold><kit>"
    lore:
      - "<dark_gray>▪ <gray>Rating: <aqua><elo></aqua> <division>"
      - "<dark_gray>▪ <gray>Peak: <white><peak>"
      - "<dark_gray>▪ <gray>Ranked record: <green><wins>W</green> <red><losses>L"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  overall: {row: top, slot: 4, material: NETHER_STAR, name: "<aqua><bold>Overall", lore: ["<gray>Rating: <aqua><elo></aqua> <division>", "<dark_gray>The average of your kit ratings"]}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu profile"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# Hotbar items in the lobby, given only with config.yml lobby-items.enabled. Each has a slot (0 to 8),
# material, name and lore, the command it runs as the player when right-clicked (without the /), show
# (idle: not queued; waiting: queued or waiting for an event; always; never, to drop a default item) and
# an optional permission players need to get it. Add more the same way, e.g. one running "duel" for the hub.
lobby-items:
  unranked: {slot: 0, show: idle, command: "duel queue", material: IRON_SWORD, name: "<green><bold>Unranked queue</bold> <gray>(right-click)", lore: ["<gray>Casual duels: no rating change"]}
  ranked: {slot: 1, show: idle, permission: duels.queue.ranked, command: "duel ranked", material: DIAMOND_SWORD, name: "<gold><bold>Ranked queue</bold> <gray>(right-click)", lore: ["<gray>Duels that move your rating"]}
  leave: {slot: 0, show: waiting, command: "duel leave", material: RED_DYE, name: "<red><bold>Leave the queue</bold> <gray>(right-click)"}
  events: {slot: 4, show: always, command: "event list", material: NETHER_STAR, name: "<light_purple><bold>Events</bold> <gray>(right-click)", lore: ["<gray>Join or watch a hosted event"]}
  editor: {slot: 7, show: idle, permission: duels.kit.edit, command: "duel editkit", material: BOOK, name: "<aqua><bold>Edit kits</bold> <gray>(right-click)", lore: ["<gray>Arrange your kit layouts"]}
  history: {slot: 8, show: always, permission: duels.history, command: "duel history", material: CLOCK, name: "<yellow><bold>Match history</bold> <gray>(right-click)", lore: ["<gray>Your latest duels"]}
  options: {slot: 6, show: idle, command: "duel options", material: COMPARATOR, name: "<gray><bold>Options</bold> <gray>(right-click)", lore: ["<gray>Requests, invites, sidebar, sounds"]}
  party: {slot: 2, show: idle, permission: duels.party, command: "party", material: CAKE, name: "<light_purple><bold>Party</bold> <gray>(right-click)", lore: ["<gray>Your party, or a public one to join"]}
  cosmetics: {slot: 3, show: idle, permission: duels.cosmetics, command: "duel cosmetics", material: BLAZE_POWDER, name: "<gold><bold>Cosmetics</bold> <gray>(right-click)", lore: ["<gray>Kill effects and kill messages"]}

# /duel customkit: a button per custom kit; a click opens it in the kit editor. <slot> is its number; a built one also
# has <name>, <items> (filled slots) and <state> (values.ready, or values.outdated once the editor no longer offers an item).
custom-kits:
  title: "Kits › Custom kits"
  rows: 4
  kit:
    name: "<gold><bold><name>"
    lore:
      - "<dark_gray>▪ <gray>Items: <white><items>"
      - "<dark_gray>▪ <state>"
      - ""
      - "<gray>Challenge with the kit <white>custom:<slot>"
      - "<yellow>▶ Click to edit"
  empty:
    material: GRAY_DYE
    name: "<gray><bold>Custom kit <slot>"
    lore: ["<gray>Empty", "", "<yellow>▶ Click to build it"]
  values:
    ready: "<green>Ready"
    outdated: "<red>Holds items the editor no longer offers: edit it"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu kits"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# The kit editor: /duel editkit <kit> (your layout of a kit), /duel customkit <slot> (a custom kit) and, for admins,
# /duels kit <kit> > Edit items. A chest laid out like an inventory: armor in slots 10 to 13 (helmet to boots), the off
# hand in 15, storage in rows 2 to 4 and the hotbar in the bottom row; these slots are fixed. Empty ones show their pane.
# Closing the editor saves the kit. <name> is the kit's name, <changes> the slots changed since it opened.
# map is shown for custom kits only, rules for custom and admin kits.
kit-editor:
  title: "<name>"
  empty:
    armor: {material: BLUE_STAINED_GLASS_PANE, name: "<gray>None", lore: ["<aqua>Click to add"]}
    storage: {material: GRAY_STAINED_GLASS_PANE, name: "<gray>None", lore: ["<aqua>Click to add"]}
    hotbar: {material: LIGHT_BLUE_STAINED_GLASS_PANE, name: "<gray>None", lore: ["<aqua>Click to add"]}
  # A layout only moves the kit's items: the first click picks an item up, the next puts it there.
  layout-empty-lore: ["<aqua>Click to put the picked item here"]
  values:
    random: "Random"
    custom-name: "Custom kit <slot>"
  map: {slot: 6, material: MAP, name: "<aqua>Change Map", lore: ["<gray>Current Map: <white><arena>"]}
  rules: {slot: 7, material: COMPARATOR, name: "<aqua>Kit Rules", lore: ["<gray>Hunger, potions, rounds..."]}
  info:
    slot: 8
    material: PAPER
    name: "<aqua>Info"
    lore:
      - "<white>Left click to change item"
      - "<white>Shift left click to remove item"
      - "<white>Right click to enchant or change count"
      - "<white>Shift right click to copy last item to slot"
      - "<gray>(<changes> items changed)"
    layout-lore:
      - "<white>Click an item to pick it up"
      - "<white>Click another slot to move it there"
      - "<gray>(<changes> items changed)"
  reset: {slot: 16, material: GUNPOWDER, name: "<aqua>Reset Kit", lore: ["<gray>Undo every change to the items"]}
  rename: {slot: 17, material: NAME_TAG, name: "<aqua>Rename Kit", lore: ["<gray>Current Name: <white><name>"]}

# Picking a piece of armor for slots 10 to 13. The pieces of each slot start at first, one per slot.
kit-editor-armor:
  title: "Armor"
  first: 19
  remove: {slot: 18, material: GRAY_STAINED_GLASS_PANE, name: "<red>Remove", lore: ["<gray>Leave the slot empty"]}
  back: {slot: 45, material: ARROW, name: "<yellow>« Back"}
  helmet: [LEATHER_HELMET, COPPER_HELMET, GOLDEN_HELMET, CHAINMAIL_HELMET, IRON_HELMET, DIAMOND_HELMET, NETHERITE_HELMET, TURTLE_HELMET]

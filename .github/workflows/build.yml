name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same sources, one build per Minecraft version (see the mc26.3 profile in pom.xml).
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
            profile: ''
          - minecraft: '26.3'
            java: '25'
            profile: '-Pmc26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B verify ${{ matrix.profile }}
      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.minecraft }}
          path: |
            api/target/elotecraft-api-*.jar
            example/target/elotecraft-example-*.jar
            duels/target/elotecraft-duels-*.jar
            !**/original-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-shaded.jar
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.minecraft }}
          path: '*/target/site/jacoco/'

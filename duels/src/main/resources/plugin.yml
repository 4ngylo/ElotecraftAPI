name: ElotecraftDuels
version: '${version}'
authors: [4ngylo]
description: 1v1 duels with kits, arenas, queues, spectators and stats.

main: me.angylo.elotecraftDuels.ElotecraftDuels
api-version: '1.21.11'
# FastAsyncWorldEdit provides WorldEdit, so either one satisfies it.
depend: [ElotecraftAPI, WorldEdit]
softdepend: [Vault, PlaceholderAPI]

# Commands (/duel, /duels) are registered at runtime by ElotecraftAPI's CommandBuilder.
permissions:
  duels.player:
    description: Every player feature.
    default: true
    children:
      duels.duel: true
      duels.select-arena: true
      duels.bet: true
      duels.queue: true
      duels.queue.ranked: true
      duels.spectate: true
      duels.stats: true
      duels.history: true
      duels.top: true
      duels.cosmetics: true
      duels.party: true
      duels.party.fight: true
      duels.kit.edit: true
      duels.kit.custom: true
      duels.event: true
      duels.event.host: true
      duels.event.host.private: true
  duels.event:
    description: Join and watch player-hosted events with /event.
    default: true
  duels.event.host:
    description: Host events with /event host.
    default: true
  duels.event.host.private:
    description: Make a hosted event private (invited players only).
    default: true
  duels.duel:
    description: Send, accept and deny duel requests and rematches.
    default: true
  duels.select-arena:
    description: Choose the arena when challenging someone.
    default: true
  duels.bet:
    description: Challenge someone for money with /duel <player> <kit> bet <amount>.
    default: true
  duels.queue:
    description: Join unranked matchmaking queues.
    default: true
  duels.queue.ranked:
    description: Join ranked matchmaking queues, which move the Elo rating.
    default: true
  duels.kit.edit:
    description: Arrange your own layout of each kit with /duel editkit.
    default: true
  duels.kit.custom:
    description: Build your own kits from the base kit's items with /duel customkit.
    default: true
  duels.party:
    description: Create, join and manage parties.
    default: true
  duels.party.fight:
    description: Start party splits, party FFAs and party vs party fights (as leader).
    default: true
  duels.spectate:
    description: Spectate other players' duels.
    default: true
  duels.stats:
    description: See your own and other players' duel stats.
    default: true
  duels.history:
    description: See your own and other players' latest duels with /duel history.
    default: true
  duels.top:
    description: See the duel leaderboard.
    default: true
  duels.cosmetics:
    description: Pick kill effects and kill messages with /duel cosmetics.
    default: true
  duels.admin:
    description: Use /duels; grants every admin permission below.
    default: op
    children:
      duels.admin.arena: true
      duels.admin.kit: true
      duels.admin.reload: true
      duels.admin.hologram: true
      duels.admin.season: true
      duels.admin.elo: true
      duels.queue.ranked.unlimited: true
      duels.admin.stop: true
      duels.bypass.cooldown: true
      duels.bypass.commands: true
  duels.admin.arena:
    description: Create and edit arenas.
    default: op
  duels.admin.kit:
    description: Create and edit kits.
    default: op
  duels.admin.reload:
    description: Reload the config, messages, menus, arenas and kits.
    default: op
  duels.admin.stop:
    description: Stop another player's duel.
    default: op
  duels.admin.hologram:
    description: Place and remove leaderboard holograms.
    default: op
  duels.admin.season:
    description: See, plan and end rating seasons with /duels season.
    default: op
  duels.admin.elo:
    description: See and change players' ratings with /duels elo.
    default: op
  duels.queue.ranked.unlimited:
    description: No ranked.daily-limit.
    default: op
  duels.bypass.commands:
    description: Run any command during a duel, not only /duel and rules.allowed-commands.
    default: op
  duels.bypass.cooldown:
    description: Send duel requests and host events without waiting for the cooldown.
    default: op

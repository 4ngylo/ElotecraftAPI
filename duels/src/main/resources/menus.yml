# Right-click on an item that can be enchanted in survival. Each enchantment gets a row of books, one per level: up to
# 5 rows from the left, then 5 more from column 5. Mending and the curses go in curse-slots. <enchant> is the book's
# enchantment and level; <value>, <durability> and <max> fill the buttons.
kit-editor-enchants:
  title: "Add enchantments"
  curse-slots: [51, 52, 53]
  book: {material: ENCHANTED_BOOK, name: "<aqua>Enchanted Book", lore: ["<gray><enchant>"], active-lore: ["<gray><enchant>", "<green>Applied: click to remove"]}
  back: {slot: 45, material: ARROW, name: "<yellow>« Back"}
  unbreakable: {slot: 47, material: STONE_BRICKS, name: "<aqua>Unbreakable", lore: ["<gray>Now: <value>", "<yellow>Click to switch"]}
  durability: {slot: 49, material: ANVIL, name: "<aqua>Durability", lore: ["<gray>Now: <white><durability>/<max>", "<yellow>Click and type it"]}
  clear: {slot: 50, material: BARRIER, name: "<red>Remove enchantments"}
  values:
    "on": "<green>On"
    "off": "<red>Off"

# Right-click on any other item. A preset is left out when it is more than the item stacks to.
kit-editor-count:
  title: "Change item count"
  presets: [1, 8, 16, 32, 64]
  first: 19
  preset: {name: "<aqua><amount>"}
  custom: {slot: 18, material: PAPER, name: "<aqua>Custom count", lore: ["<gray>1 to <max>", "<yellow>Click and type it"]}
  back: {slot: 45, material: ARROW, name: "<yellow>« Back"}

# Change Map, for custom kits: Random or one of the arenas the base kit takes. <arena> is the arena's name.
# The back button sits in the bottom row (slot 1 to 7).
kit-editor-arenas:
  title: "Change Map"
  rows: 4
  random: {material: MAP, name: "<aqua>Random", lore: ["<gray>Any arena the kit takes", "<yellow>Click to pick"], selected-lore: ["<gray>Any arena the kit takes", "<green>Picked"]}
  # Shown with the arena's icon.
  arena: {name: "<aqua><arena>", lore: ["<yellow>Click to pick"], selected-lore: ["<green>Picked"]}
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 4, material: ARROW, name: "<yellow>« Back"}

# A kit's items, opened by right-clicking it in a kit menu: storage, hotbar, then armor and off hand.
# The bottom-row buttons have a slot from 0 to 8.
kit-preview:
  title: "Preview › <kit>"
  back: {slot: 3, material: ARROW, name: "<yellow>« Back"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}

# /duel inventory, from the names after a fight: a fighter as the fight left them, laid out like the kit
# preview. The bottom-row buttons (slot 0 to 8) may use <player>, <health> (hearts), <food>, <effects>,
# <hits>, <combo> (longest run of hits without being hit), <thrown>, <missed> and <accuracy> (health potions).
fight-inventory:
  title: "<player>'s inventory"
  health: {slot: 0, material: GLISTERING_MELON_SLICE, name: "<red><bold>Health", lore: ["<gray><white><health></white> ❤"]}
  food: {slot: 1, material: COOKED_BEEF, name: "<gold><bold>Food", lore: ["<gray><white><food></white>/20"]}
  effects: {slot: 2, material: BREWING_STAND, name: "<light_purple><bold>Effects", lore: ["<gray><effects>"]}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}
  hits: {slot: 6, material: IRON_SWORD, name: "<yellow><bold>Hits", lore: ["<gray>Landed: <white><hits>", "<gray>Longest combo: <white><combo>"]}
  potions:
    slot: 7
    material: SPLASH_POTION
    name: "<aqua><bold>Health potions"
    lore: ["<gray>Thrown: <white><thrown>", "<gray>Missed: <white><missed>", "<gray>Accuracy: <white><accuracy>"]
  values:
    none: "none"

# /duel options: each player's own switches, <value> being values.on or values.off. Remove an option's
# section to stop offering it (it then stays as the player left it, on by default).
options:
  title: "Duels › Options"
  rows: 3
  values:
    "on": "<green>On"
    "off": "<red>Off"
    any: "<green>Any"
    ms: "<yellow>up to <ms> ms"
  requests:
    slot: 10
    "on": LIME_DYE
    "off": GRAY_DYE
    name: "<gold><bold>Duel requests"
    lore: ["<gray>Others may challenge you: <value>", "<dark_gray>Same as /duel toggle requests", "", "<yellow>▶ Click to switch"]
  spectators:
    slot: 11
    "on": ENDER_EYE
    "off": GRAY_DYE
    name: "<aqua><bold>Spectators"
    lore: ["<gray>Others may watch your duels: <value>", "<dark_gray>Staff always can", "", "<yellow>▶ Click to switch"]
  party-invites:
    slot: 12
    "on": CAKE
    "off": GRAY_DYE
    name: "<light_purple><bold>Party invites"
    lore: ["<gray>Others may invite you: <value>", "", "<yellow>▶ Click to switch"]
  lobby-players:
    slot: 13
    "on": PLAYER_HEAD
    "off": GRAY_DYE
    name: "<yellow><bold>Lobby players"
    lore: ["<gray>See other players in the lobby: <value>", "<dark_gray>Your party always shows", "", "<yellow>▶ Click to switch"]
  sidebar:
    slot: 14
    "on": OAK_SIGN
    "off": GRAY_DYE
    name: "<aqua><bold>Sidebar"
    lore: ["<gray>Duel sidebar shown: <value>", "", "<yellow>▶ Click to switch"]
  # The highest ping of opponents the queues pair you with; each click moves to the next choice.
  ping-range:
    slot: 15
    material: REPEATER
    name: "<green><bold>Ping range"
    lore: ["<gray>Opponents' ping: <value>", "<dark_gray>Both players' ranges must fit", "", "<yellow>▶ Click to change"]
  sounds:
    slot: 16
    "on": NOTE_BLOCK
    "off": GRAY_DYE
    name: "<green><bold>Sounds"
    lore: ["<gray>Duel sounds played to you: <value>", "", "<yellow>▶ Click to switch"]
  back: {slot: 21, material: ARROW, name: "<yellow>« Back", command: "duel"}
  close: {slot: 22, material: BARRIER, name: "<red>Close"}

# /duel history [player]: their latest duels, newest first. <player> in the title; each duel may use
# <opponent>, <kit>, <arena>, <time> (fight length), <ago>, <rating> (change, or values.unranked), <how>
# (values.eliminated, forfeit or quit) and <health> (the winner's hearts left).
history:
  title: "Profile › <player>'s duels"
  rows: 6
  won:
    name: "<green><bold>Won</bold> <gray>vs <white><opponent>"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Ended by <white><how></white> after <white><time>"
      - "<dark_gray>▪ <gray>Health left: <red><health>❤"
      - "<dark_gray>▪ <gray>Rating: <white><rating>"
      - ""
      - "<dark_gray><ago> ago"
  lost:
    name: "<red><bold>Lost</bold> <gray>vs <white><opponent>"
    lore:
      - "<dark_gray>▪ <gray>Kit: <white><kit>"
      - "<dark_gray>▪ <gray>Arena: <white><arena>"
      - "<dark_gray>▪ <gray>Ended by <white><how></white> after <white><time>"
      - "<dark_gray>▪ <gray>Their health left: <red><health>❤"
      - "<dark_gray>▪ <gray>Rating: <white><rating>"
      - ""
      - "<dark_gray><ago> ago"
  values:
    unranked: "unranked"
    eliminated: "a kill"
    forfeit: "a forfeit"
    quit: "a quit"
  previous: {material: ARROW, name: "<yellow>« Previous page"}
  next: {material: ARROW, name: "<yellow>Next page »"}
  back: {slot: 3, material: ARROW, name: "<yellow>« Back", command: "duel menu profile"}
  close: {slot: 4, material: BARRIER, name: "<red>Close"}


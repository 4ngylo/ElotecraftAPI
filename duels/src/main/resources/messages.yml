# ElotecraftDuels text, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# <prefix> works in every message. Tags such as <player> or <kit> are filled in by the plugin.
# Add messages_<language>.yml (e.g. messages_es.yml) next to this file for players whose client
# uses that language; keys it lacks come from this file. PlaceholderAPI placeholders work too.
prefix: "<gradient:#ff416c:#ff4b2b><bold>Duels</bold></gradient> <dark_gray>»</dark_gray> "

command:
  no-permission: "<prefix><red>You don't have permission to do that."
  player-only: "<prefix><red>Only players can do that."
  duel-description: "Challenge players to 1v1 duels"
  admin-description: "Manage duel arenas and kits"
  party-description: "Play with friends in a party"
  party-chat-description: "Talk to your party"
  event-description: "Join, watch and host player events"
  event-help: |-
    <gradient:#ff416c:#ff4b2b><bold>⚔ Events</bold></gradient>
    <yellow>/event</yellow> <dark_gray>-</dark_gray> <gray>events to join or watch (your settings while you host)
    <yellow>/event join <host></yellow> <dark_gray>·</dark_gray> <yellow>/event leave</yellow> <dark_gray>-</dark_gray> <gray>join or leave an event
    <yellow>/event host [kit]</yellow> <dark_gray>-</dark_gray> <gray>host one: pick the kit, arena, rules and mode (free for all, teams, tournament, sumo or double elimination)
    <yellow>/event settings|start|cancel</yellow> <dark_gray>-</dark_gray> <gray>run your event
    <yellow>/event invite <player></yellow> <dark_gray>-</dark_gray> <gray>let someone into your private event
  party-help: |-
    <gradient:#ff416c:#ff4b2b><bold>⚔ Parties</bold></gradient>
    <yellow>/party <player></yellow> <dark_gray>-</dark_gray> <gray>invite someone (makes a party if you have none)
    <yellow>/party accept|deny [player]</yellow> <dark_gray>-</dark_gray> <gray>answer an invite
    <yellow>/party kick|promote <player></yellow> <dark_gray>-</dark_gray> <gray>manage members (leader)
    <yellow>/party leave</yellow> <dark_gray>·</dark_gray> <yellow>/party disband</yellow> <dark_gray>·</dark_gray> <yellow>/party info</yellow>
    <yellow>/party split|ffa [kit] [arena]</yellow> <dark_gray>-</dark_gray> <gray>fight inside your party: two teams, or everyone for themselves
    <yellow>/party duel <leader> [kit] [arena]</yellow> <dark_gray>-</dark_gray> <gray>challenge another party
    <yellow>/party</yellow> <dark_gray>-</dark_gray> <gray>party menu: members, public parties, fights
    <yellow>/party public</yellow> <dark_gray>-</dark_gray> <gray>let anyone join without an invite, or stop (leader)
    <yellow>/party join <leader></yellow> <dark_gray>-</dark_gray> <gray>join a public party
    <yellow>/party chat [message]</yellow> <dark_gray>·</dark_gray> <yellow>/pc [message]</yellow> <dark_gray>-</dark_gray> <gray>talk to your party; without a message, your chat goes to the party until you run it again
  help: |-
    <gradient:#ff416c:#ff4b2b><bold>⚔ Duels</bold></gradient>
    <yellow>/duel <player> [kit] [arena]</yellow> <dark_gray>-</dark_gray> <gray>challenge someone
    <yellow>/duel <player> <kit> [arena] bet <amount></yellow> <dark_gray>-</dark_gray> <gray>challenge for money
    <yellow>/duel accept|deny [player]</yellow> <dark_gray>-</dark_gray> <gray>answer a challenge
    <yellow>/duel cancel [player]</yellow> <dark_gray>-</dark_gray> <gray>take back a challenge you sent
    <yellow>/duel rematch</yellow> <dark_gray>-</dark_gray> <gray>challenge your last opponent again
    <yellow>/duel queue [kit]</yellow> <dark_gray>-</dark_gray> <gray>find an opponent
    <yellow>/duel ranked [kit]</yellow> <dark_gray>-</dark_gray> <gray>find an opponent near your rating
    <yellow>/duel spectate [player]</yellow> <dark_gray>-</dark_gray> <gray>watch a duel; without a player, pick a fight
    <yellow>/duel editkit [kit]</yellow> <dark_gray>-</dark_gray> <gray>arrange your items in a kit
    <yellow>/duel customkit</yellow> <dark_gray>-</dark_gray> <gray>build your own kits, then challenge with the kit custom:<number>
    <yellow>/duel leave</yellow> <dark_gray>-</dark_gray> <gray>leave the queue, stop spectating or forfeit
    <yellow>/duel toggle <option></yellow> <dark_gray>-</dark_gray> <gray>turn duel requests or another option off or on
    <yellow>/duel options</yellow> <dark_gray>-</dark_gray> <gray>requests, party invites, sidebar and sounds
    <yellow>/duel cosmetics</yellow> <dark_gray>-</dark_gray> <gray>kill effects and kill messages
    <yellow>/duel stats [player]</yellow> <dark_gray>·</dark_gray> <yellow>/duel top [elo [kit]|season <n>]</yellow> <dark_gray>-</dark_gray> <gray>statistics
    <yellow>/duel history [player]</yellow> <dark_gray>-</dark_gray> <gray>latest duels
  admin-help: |-
    <gradient:#ff416c:#ff4b2b><bold>⚔ Duels admin</bold></gradient>
    <yellow>/duels arena</yellow> <dark_gray>-</dark_gray> <gray>create and edit arenas
    <yellow>/duels kit</yellow> <dark_gray>-</dark_gray> <gray>create and edit kits
    <yellow>/duels hologram</yellow> <dark_gray>-</dark_gray> <gray>floating leaderboards
    <yellow>/duels season [end]</yellow> <dark_gray>-</dark_gray> <gray>the rating season; end it to archive and reset ratings
    <yellow>/duels stop <player></yellow> <dark_gray>-</dark_gray> <gray>stop someone's duel
    <yellow>/duels reload</yellow> <dark_gray>-</dark_gray> <gray>reload config, messages, menus, arenas and kits
  arena-help: |-
    <gradient:#4facfe:#00f2fe><bold>Arena setup</bold></gradient> <dark_gray>(stand where each point should be)</dark_gray>
    <yellow>/duels arena [name]</yellow> <dark_gray>-</dark_gray> <gray>menu of every arena, or of one arena's settings
    <yellow>/duels arena create <name></yellow> <dark_gray>-</dark_gray> <gray>new arena in your world
    <yellow>/duels arena setspawn <name> <1|2></yellow> <dark_gray>-</dark_gray> <gray>where each fighter starts
    <yellow>/duels arena setcorner <name> <1|2></yellow> <dark_gray>-</dark_gray> <gray>opposite corners around the whole arena
    <yellow>/duels arena setgoal|setbed <name> <1|2></yellow> <dark_gray>-</dark_gray> <gray>a side's bridge goal where you stand, or the bed you look at
    <yellow>/duels arena setbox <name></yellow> <dark_gray>-</dark_gray> <gray>both corners from your WorldEdit selection
    <yellow>/duels arena import <name> <file.schem></yellow> <dark_gray>-</dark_gray> <gray>new arena from a schematic in the arenas world
    <yellow>/duels arena setspectator <name></yellow> <dark_gray>-</dark_gray> <gray>where spectators appear (optional)
    <yellow>/duels arena addspawn|clearspawns <name></yellow> <dark_gray>-</dark_gray> <gray>spawns for party FFAs (one per player)
    <yellow>/duels arena setcenter <name></yellow> <dark_gray>-</dark_gray> <gray>middle of the arena; spectators appear there if no spectator spawn (optional)
    <yellow>/duels arena category <name> add|remove <category></yellow> <dark_gray>-</dark_gray> <gray>arena pools kits pick from
    <yellow>/duels arena buildlimit <name> <y|none></yellow> <dark_gray>-</dark_gray> <gray>highest Y fighters may place blocks at
    <yellow>/duels arena seticon <name></yellow> <dark_gray>-</dark_gray> <gray>menu icon: the item in your hand
    <yellow>/duels arena setname <name> <text></yellow> <dark_gray>-</dark_gray> <gray>name shown to players
    <yellow>/duels arena snapshot <name></yellow> <dark_gray>-</dark_gray> <gray>save its blocks, to rebuild it after a crash
    <yellow>/duels arena reset <name></yellow> <dark_gray>-</dark_gray> <gray>put its blocks back as in the snapshot
    <yellow>/duels arena pregen <name> <count|clear></yellow> <dark_gray>-</dark_gray> <gray>copies in the arenas world, one duel each
    <yellow>/duels arena toggle|info|tp|delete <name></yellow> <dark_gray>·</dark_gray> <yellow>/duels arena list</yellow>
  hologram-help: |-
    <gradient:#f7971e:#ffd200><bold>Leaderboard holograms</bold></gradient> <dark_gray>(the lines of /duel top, read every minute)</dark_gray>
    <yellow>/duels hologram create <name> wins</yellow> <dark_gray>-</dark_gray> <gray>top players by wins, where you stand
    <yellow>/duels hologram create <name> elo [kit]</yellow> <dark_gray>-</dark_gray> <gray>top overall rating, or one kit's
    <yellow>/duels hologram delete <name></yellow> <dark_gray>·</dark_gray> <yellow>/duels hologram list</yellow>
    <gray>Creating one with a name in use moves and replaces it.
  kit-help: |-
    <gradient:#f7971e:#ffd200><bold>Kit setup</bold></gradient> <dark_gray>(uses your inventory, armor and off hand)</dark_gray>
    <yellow>/duels kit [name]</yellow> <dark_gray>-</dark_gray> <gray>menu of every kit, or of one kit's settings
    <yellow>/duels kit create <name></yellow> <dark_gray>-</dark_gray> <gray>new kit from your inventory
    <yellow>/duels kit save <name></yellow> <dark_gray>-</dark_gray> <gray>overwrite a kit with your inventory
    <yellow>/duels kit load <name></yellow> <dark_gray>-</dark_gray> <gray>put a kit in your empty inventory to edit it
    <yellow>/duels kit seticon <name></yellow> <dark_gray>-</dark_gray> <gray>menu icon: the item in your hand
    <yellow>/duels kit setname <name> <text></yellow> <dark_gray>-</dark_gray> <gray>name shown to players
    <yellow>/duels kit setpermission <name> <permission|none></yellow> <dark_gray>-</dark_gray> <gray>who may use it
    <yellow>/duels kit build <name></yellow> <dark_gray>-</dark_gray> <gray>let fighters place blocks, or stop it
    <yellow>/duels kit damage <name></yellow> <dark_gray>-</dark_gray> <gray>knockback-only hits (Sumo), or normal again
    <yellow>/duels kit mode <name> [normal|bridge|bed-fight]</yellow> <dark_gray>-</dark_gray> <gray>goals or beds decide fights
    <yellow>/duels kit effect <name> [effect level]</yellow> <dark_gray>-</dark_gray> <gray>potion effects for the whole fight (level 0 removes)
    <yellow>/duels kit rule <name> [rule] [value|default]</yellow> <dark_gray>-</dark_gray> <gray>game rules: hunger, regeneration, pearl cooldown...
    <yellow>/duels kit defaults</yellow> <dark_gray>-</dark_gray> <gray>add the default kits that are missing
    <yellow>/duels kit arenas <name> <category...|any></yellow> <dark_gray>-</dark_gray> <gray>which arena categories its duels use
    <yellow>/duels kit delete <name></yellow> <dark_gray>·</dark_gray> <yellow>/duels kit list</yellow>

general:
  player-not-found: "<prefix><red>'<player>' is not online."
  kit-not-found: "<prefix><red>There is no kit called '<kit>'."
  arena-not-found: "<prefix><red>There is no arena called '<arena>'."
  no-kits: "<prefix><red>No kits have been set up yet."
  kit-locked: "<prefix><red>You can't use the <kit> kit."
  busy-self: "<prefix><red>You're already in a duel, a queue, an event or spectating. <gray>Use <white>/duel leave</white> first."
  busy-other: "<prefix><red><player> is busy right now."
  no-free-arena: "<prefix><red>Every arena is in use; try again in a moment."
  arena-busy: "<prefix><red><arena> is in use; pick another arena or a random one."
  no-arena-for-kit: "<prefix><red>No arena is ready for <kit> yet."
  arena-wrong-kit: "<prefix><red><arena> can't be used with <kit>."
  not-dueling: "<prefix><red><player> isn't in a duel."
  storage-error: "<prefix><red>Your duel data couldn't be saved, so nothing changed. Try again or tell an admin."
  menu-error: "<prefix><red>That menu is misconfigured; please tell an admin."
  restored: "<prefix><gray>Your items and position were restored from a duel that didn't finish."
  nothing-to-leave: "<prefix><red>You're not in a queue, an event, a duel or spectating."
  random-arena: "Random arena"
  slow-down: "<prefix><red>Wait <time> before doing that again."
  kit-build: "<green>Building allowed"
  kit-no-build: "<gray>No building"

# /duel toggle <option> for options other than requests (those use request.toggled-on/off); usage is
# /duel toggle alone.
options:
  usage: "<prefix><red>Use /duel toggle <option>. Options: <gray><options>"
  toggled-on: "<prefix><white><option></white><gray>: <green>on"
  toggled-off: "<prefix><white><option></white><gray>: <red>off"
  unknown: "<prefix><red>There is no option called '<option>'. Options: <gray><options>"
  names:
    requests: "Duel requests"
    party-invites: "Party invites"
    sidebar: "Sidebar"
    sounds: "Sounds"
    spectators: "Spectators"
    lobby-players: "Lobby players"

request:
  # <cancel>...</cancel> runs /duel cancel <player> when clicked.
  sent: "<prefix><gray>Challenged <white><player></white> to a <white><kit></white> duel <dark_gray>(<arena>)</dark_gray>. <cancel><red>[CANCEL]</red></cancel>"
  cancel-hover: "<red>Click to take the challenge back"
  received: |-
    <prefix><white><player></white> <gray>challenged you to a duel!
     <dark_gray>▪</dark_gray> <gray>Kit: <white><kit>
     <dark_gray>▪</dark_gray> <gray>Arena: <white><arena>
     <accept><green><bold>[ACCEPT]</bold></green></accept>  <deny><red><bold>[DENY]</bold></red></deny>
  accept-hover: "<green>Click to accept"
  deny-hover: "<red>Click to deny"
  accepted: "<prefix><white><player></white> <green>accepted your duel!"
  denied: "<prefix><white><player></white> <red>denied your duel."
  you-denied: "<prefix><gray>You denied <white><player></white>'s duel."
  you-cancelled: "<prefix><gray>You took back your challenge to <white><player></white>."
  cancelled: "<prefix><white><player></white> <gray>took back their duel request."
  none-sent: "<prefix><red>You haven't challenged anyone."
  none-to: "<prefix><red>You haven't challenged <player>."
  choose-cancel: "<prefix><red>You challenged several players; use <white>/duel cancel <name></white>."
  expired-sender: "<prefix><gray>Your duel request to <white><player></white> expired."
  expired-target: "<prefix><gray>The duel request from <white><player></white> expired."
  cancelled-quit: "<prefix><gray><white><player></white> left, so the duel request was cancelled."
  none: "<prefix><red>Nobody has challenged you."
  none-from: "<prefix><red><player> hasn't challenged you."
  choose: "<prefix><red>Several players challenged you; use <white>/duel accept <name></white>."
  already-sent: "<prefix><red>You already challenged <player>; wait for an answer."
  self: "<prefix><red>You can't duel yourself."
  cooldown: "<prefix><red>Wait <time> before sending another duel request."
  rematch-none: "<prefix><red>There is nobody to rematch right now."
  disabled: "<prefix><red><player> doesn't take duel requests."
  toggled-off: "<prefix><gray>You no longer get duel requests. <white>/duel toggle requests</white> turns them back on."
  toggled-on: "<prefix><green>You get duel requests again."

queue:
  ranked-limit: "<prefix><red>You played your <limit> ranked duels for today. <gray>Unranked queues are open."
  # <type> is type-ranked or type-unranked below.
  type-ranked: "Ranked"
  type-unranked: "Unranked"
  joined: "<prefix><green>Joined the <type> <white><kit></white> queue. <gray>(<queued> waiting)"
  left: "<prefix><gray>You left the <type> <white><kit></white> queue."
  action-bar: "<gray>Looking for an opponent <dark_gray>·</dark_gray> <white><kit></white> <dark_gray>·</dark_gray> <yellow><time>"
  # <elo> is the player's rating, <range> how far from it an opponent may be rated right now.
  action-bar-ranked: "<gold>Ranked</gold> <dark_gray>·</dark_gray> <white><kit></white> <dark_gray>·</dark_gray> <yellow><time></yellow> <dark_gray>·</dark_gray> <gray>Rating <white><elo></white> ±<range>"
  waiting-arena: "<prefix><yellow>Opponent found! Waiting for a free arena..."
  kit-removed: "<prefix><red>The <kit> kit is gone, so you left its queue."

match:
  starting: "<prefix><gray>Duel against <white><opponent></white> <dark_gray>·</dark_gray> <white><kit></white> <dark_gray>·</dark_gray> <white><arena>"
  countdown-title: "<gradient:#f7971e:#ffd200><bold><seconds>"
  countdown-subtitle: "<gray>vs <white><opponent>"
  # Kits with rounds-to-win: <round> is the round, <score> the fighter's rounds against the opponent's.
  round-countdown-subtitle: "<gray>Round <white><round></white> <dark_gray>·</dark_gray> <white><score>"
  fight-title: "<gradient:#ff416c:#ff4b2b><bold>FIGHT!"
  fight-subtitle: "<gray>Good luck"
  boss-bar: "<gray>Time left <dark_gray>·</dark_gray> <white><time>"
  victory-title: "<gradient:#56ab2f:#a8e063><bold>VICTORY"
  victory-subtitle: "<gray>You defeated <white><opponent>"
  defeat-title: "<gradient:#cb2d3e:#ef473a><bold>DEFEAT"
  defeat-subtitle: "<white><opponent></white> <gray>won with <red><health>❤"
  draw-title: "<yellow><bold>DRAW"
  draw-subtitle: "<gray>Time ran out"
  # Duel results: clicking <winner> and <loser> (<first> and <second> in a draw) opens their inventory.
  result: "<prefix><white><winner></white> <gray>defeated</gray> <white><loser></white> <dark_gray>(<red><health>❤</red> left · <time> · <kit>)"
  # A kit with rounds-to-win: <score> is the winner's rounds against the loser's.
  result-rounds: "<prefix><white><winner></white> <gray>defeated</gray> <white><loser></white> <white><score></white> <dark_gray>(<red><health>❤</red> left · <kit>)"
  # After a round that did not decide the fight: <winner>, <round> that ended, <score> as the winner sees it.
  round-won: "<prefix><white><winner></white> <gray>won round <round> <dark_gray>(<white><score></white>)"
  # Bridge and bed fight kits (/duels kit mode): knocked-out fighters come back at their spawn.
  respawned-title: "<gray>Respawned"
  respawned-subtitle: ""
  scored: "<prefix><gold><bold>GOAL!</bold></gold> <white><player></white> <gray>scored."
  # <team> is the names of the side whose bed broke, <player> who broke it.
  bed-broken: "<prefix><red><bold>BED DESTROYED</bold></red> <gray><white><player></white> broke the bed of <white><team></white>."
  bed-broken-title: "<red><bold>BED DESTROYED"
  bed-broken-subtitle: "<gray>You will no longer respawn"
  own-bed: "<prefix><red>You can't break your own bed."
  round-won-title: "<gradient:#f7971e:#ffd200><bold>ROUND <round>"
  # <score> here is the score as the fighter seeing the title sees it.
  round-won-subtitle: "<white><winner></white> <gray>won it <dark_gray>·</dark_gray> <white><score>"
  result-quit: "<prefix><white><loser></white> <gray>left the duel, so <white><winner></white> wins."
  result-forfeit: "<prefix><white><loser></white> <gray>forfeited, so <white><winner></white> wins."
  result-draw: "<prefix><gray>The duel between <white><first></white> and <white><second></white> ended in a draw."
  # Team and party fights: <winners> are the winning team's names.
  result-team: "<prefix><white><winners></white> <gray>won the fight <dark_gray>(<time> · <kit>)"
  result-draw-team: "<prefix><gray>The fight between <white><first></white> and <white><second></white> ended in a draw."
  team-defeat-subtitle: "<white><winners></white> <gray>won"
  knocked-out: "<prefix><white><player></white> <gray>is out."
  # After a ranked duel: <change>, the new <elo> in <kit>, and its <division> (empty with divisions off).
  elo-gained: "<prefix><white><kit></white> <gray>rating <green>+<change></green> <dark_gray>·</dark_gray> <white><elo></white> <division>"
  elo-lost: "<prefix><white><kit></white> <gray>rating <red>-<change></red> <dark_gray>·</dark_gray> <white><elo></white> <division>"
  division-up: "<prefix><green>Promoted to <division></green> <gray>in <white><kit></white>!"
  division-down: "<prefix><red>Dropped to <division></red> <gray>in <white><kit></white>."
  cancelled: "<prefix><red>The duel was cancelled."
  cancelled-quit: "<prefix><red><player> left before the fight, so the duel was cancelled."
  cancelled-admin: "<prefix><red>An admin stopped the duel."
  teleport-failed: "<prefix><red>Couldn't teleport everyone to the arena, so the duel was cancelled."
  arena-failed: "<prefix><red>The arena couldn't be prepared, so the duel didn't start. Try another arena or tell an admin."
  rematch-offer: "<prefix><rematch><gold><bold>[REMATCH]</bold></gold></rematch> <gray>Challenge <white><opponent></white> again"
  rematch-hover: "<gold>Click to request a rematch"
  out-of-bounds: "<prefix><red>You can't leave the arena."
  blocked-command: "<prefix><red>You can't use that command during a duel."
  blocked-teleport: "<prefix><red>You can't teleport away during a duel."
  reward-win: "<prefix><green>+<amount> <gray>for winning."
  reward-loss: "<prefix><gray>+<amount> for playing."
  # Action bar of a hits-to-win (boxing) kit, to the attacker: <hits> on <player> out of <max>.
  hits: "<gray>Hits on <white><player></white> <dark_gray>·</dark_gray> <green><hits></green><gray>/<max>"
  # After a party fight or event: <players> are the fighters' names, each an inventory-entry that opens their
  # inventory. In a duel the names in the result line open them.
  inventories: "<prefix><gray>Inventories: <players>"
  inventory-entry: "<aqua>[<player>]"
  inventory-hover: "<gray>See <white><player></white>'s inventory"
  inventory-gone: "<prefix><red>That fight's inventories are no longer kept."
  inventory-after-fight: "<prefix><red>You can see inventories once the fight is over."
  # To an archer whose arrow hit (config.yml match.arrow-health); <health> is in hearts.
  arrow-health: "<prefix><white><player></white> <gray>is on <red><health>❤"

spectate:
  started: "<prefix><gray>Spectating <white><player></white>'s duel. <dark_gray>Use /duel leave to stop."
  joined: "<prefix><white><player></white> <gray>is watching your duel."
  stopped: "<prefix><gray>You stopped spectating."
  ended: "<prefix><gray>The duel you were watching ended."
  failed: "<prefix><red>Couldn't take you to that duel."
  not-allowed: "<prefix><red>That fight can't be watched."
  none: "<prefix><gray>There's no fight you can watch right now."

editor:
  started: "<prefix><gray>Arrange <white><kit></white> in your inventory, then <save><green><bold>[SAVE]</bold></green></save> or <cancel><red><bold>[CANCEL]</bold></red></cancel> <dark_gray>(/duel editkit save|cancel)"
  save-hover: "<green>Click to save this layout"
  cancel-hover: "<red>Click to stop without saving"
  saved: "<prefix><green>Saved your layout of <white><kit></white>; your duels with it use it."
  invalid: "<prefix><red>Your inventory must hold exactly the items of <kit>: put everything back and try again."
  cancelled: "<prefix><gray>Stopped editing; nothing was saved."
  timed-out: "<prefix><gray>The kit editor timed out; nothing was saved."
  already: "<prefix><red>You're already editing a kit: <white>/duel editkit save</white> or <white>cancel</white>."
  not-editing: "<prefix><red>You're not editing a kit."
  reset: "<prefix><green>Your layout of <white><kit></white> is gone; you get the kit as made again."
  # Building a custom kit (/duel customkit) from the items of <kit>, the base kit; <slot> is its number.
  custom-started: "<prefix><gray>Building custom kit <white><slot></white>: pick <items><aqua><bold>[ITEMS]</bold></aqua></items> from <white><kit></white>, arrange them, then <save><green><bold>[SAVE]</bold></green></save> or <cancel><red><bold>[CANCEL]</bold></red></cancel>"
  items-hover: "<aqua>Click to pick items"
  custom-saved: "<prefix><green>Saved custom kit <white><slot></white>. <gray>Use it as the kit <white>custom:<slot></white> when you challenge someone."
  custom-deleted: "<prefix><gray>Custom kit <white><slot></white> was empty, so it is gone."
  custom-invalid: "<prefix><red>Only items from <kit> can go in a custom kit: take out the others and try again."

custom-kit:
  disabled: "<prefix><red>Custom kits are off on this server."
  no-slot: "<prefix><red>Pick a custom kit from 1 to <slots>."
  not-building: "<prefix><red>You're not building a custom kit: <white>/duel customkit</white>."
  inventory-full: "<prefix><red>Your inventory is full: click an item in it to take it out."

party:
  created: "<prefix><green>Created a party. <gray>Invite players with <white>/party <player></white>."
  opened: "<prefix><green>The party is public: anyone may join with <white>/party join <player></white>."
  closed: "<prefix><gray>The party is private again: invites only."
  # To everyone not in a party, once a minute at most; <join>...</join> runs /party join <player>.

    rules-header: "<prefix><gray>Game rules of <white><kit></white> <dark_gray>(gray: default)</dark_gray>:"
    rule-entry: " <dark_gray>▪</dark_gray> <white><rule></white>: <green><value>"
    rule-entry-default: " <dark_gray>▪</dark_gray> <gray><rule>: <value>"
    rule-vanilla: "vanilla"
    rule-set: "<prefix><green><white><rule></white> of <white><kit></white> is now <white><value></white>."
    effects: "<prefix><gray>Effects of <white><kit></white>: <white><effects>"
    effect-usage: "<prefix><red>Use /duels kit effect <name> <effect> <level>, level 1 to <max>, or 0 to remove it."
    effect-set: "<prefix><green><white><kit></white> gives <white><effect> <level></white> for the whole fight."
    effect-removed: "<prefix><green><white><kit></white> no longer gives <white><effect></white>."
    rule-usage: "<prefix><red>Use /duels kit rule <name> [rule] [value|default]. Rules: <gray><rules>"
    rule-flag-usage: "<prefix><red><rule> is true, false or default."
    rule-seconds-usage: "<prefix><red><rule> is a number of seconds from 0 to <max>, or default."
    rule-number-usage: "<prefix><red><rule> is a whole number from 0 to <max>, or default."
    # Asked in chat by the /duels kit menus.
    prompt-create: "<prefix><gray>Type a name for the new kit (lowercase letters, digits, - and _), or <white>cancel</white>."
    prompt-name: "<prefix><gray>Type the name to show for <white><kit></white> (e.g. <white>\\<gold>Sword</white>), or <white>cancel</white>."
    prompt-permission: "<prefix><gray>Type the permission <white><kit></white> needs, <white>none</white> for everyone, or <white>cancel</white>."
    prompt-arenas: "<prefix><gray>Type the arena categories for <white><kit></white> separated by spaces, <white>any</white>, or <white>cancel</white>."
    prompt-seconds: "<prefix><gray>Type <white><rule></white> for <white><kit></white> in seconds (0 to <max>), <white>default</white>, or <white>cancel</white>."
    prompt-number: "<prefix><gray>Type <white><rule></white> for <white><kit></white> (0 to <max>), <white>default</white>, or <white>cancel</white>."

# The sidebar (config.yml sidebar), one line per row, at most 15 rows; an empty row is a gap.
# During fights: <kit>, <arena>, <time> (left, m:ss), <ping>; in duels <opponent>, <opponent_health>,
# <opponent_ping>, and in ranked ones <elo>, <division> and <opponent_elo> (ratings in the fight's kit);
# in party fights <team_left> and <enemies_left>; for spectators <fighters>. In the lobby: <wins>, <losses>,
# <win_rate>, <win_streak>, <best_win_streak>, <elo> and <division> (overall), <rank>, <queue>, <party> and
# <active_matches>.
sidebar:
  # Match sidebars may use <round> and <score> (the viewer's rounds against the opponent's), or <rounds>:
  # this line in a kit with rounds-to-win, nothing otherwise.
  rounds: "<dark_gray> · <gray>Round <white><round></white> <white><score>"
  match-title: "<gradient:#ff416c:#ff4b2b><bold>⚔ DUEL"
  lobby-title: "<gradient:#ff416c:#ff4b2b><bold>⚔ DUELS"
  duel: |-
    <dark_gray><time><rounds>
    <gray>Opponent: <white><opponent>
    <gray>Health: <red><opponent_health>❤
    <gray>Ping: <white><opponent_ping>ms

    <gray>Kit: <white><kit>
    <gray>Arena: <white><arena>

    <gray>Your ping: <white><ping>ms
  ranked-duel: |-
    <dark_gray><time><rounds>
    <gray>Opponent: <white><opponent>
    <gray>Health: <red><opponent_health>❤
    <gray>Ping: <white><opponent_ping>ms

    <gray>Rating: <aqua><elo> <dark_gray>vs</dark_gray> <aqua><opponent_elo>
    <gray>Kit: <white><kit>
    <gray>Arena: <white><arena>

    <gray>Your ping: <white><ping>ms
  team-fight: |-
    <dark_gray><time>
    <gray>Your team: <green><team_left> left
    <gray>Enemies: <red><enemies_left> left

    <gray>Kit: <white><kit>
    <gray>Arena: <white><arena>

    <gray>Your ping: <white><ping>ms
  spectating: |-
    <dark_gray><time>
    <gray>Watching: <white><fighters>

    <gray>Kit: <white><kit>
    <gray>Arena: <white><arena>
  lobby: |-
    <gray>Rating: <aqua><elo><dark_gray><rank>
    <gray>Wins: <green><wins>
    <gray>Losses: <red><losses>
    <gray>Win rate: <white><win_rate>%
    <gray>Streak: <white><win_streak> <dark_gray>(best <best_win_streak>)

    <gray>Queue: <white><queue>
    <gray>Party: <white><party>

    <gray>Dueling now: <white><active_matches>
  rank: " #<position>"    # starts with a space: it follows <elo>
  no-rank: ""
  queue: "<kit> <dark_gray>(<type>)"
  queue-none: "<dark_gray>none"
  party: "<size> players"
  party-none: "<dark_gray>none"
  loading: "<dark_gray>..."
  # After the health under players' names in fights (config.yml sidebar.health-below-name).
  health-below-name: "<red>❤"

# Leaderboard holograms (/duels hologram); their lines are those of top above.
holograms:
  loading: "<gray>Loading..."
  empty: "<gray>No duels yet"

# /duel cosmetics
cosmetics:
  usage: "<prefix><red>Use /duel cosmetics [kill-effect|kill-message]."
  chosen: "<prefix><green>Picked <name><green>."
  removed: "<prefix><gray>Dropped <name><gray>."
  locked: "<prefix><red><name> <red>is locked."

# The kill messages of config.yml cosmetics.kill-messages, by id: sent to everyone in the fight when the
# player who picked one knocks someone out, in place of match.knocked-out. <killer> and <victim>.
kill-messages:
  slain: "<prefix><white><victim></white> <gray>was slain by</gray> <white><killer></white><gray>."
  outplayed: "<prefix><white><victim></white> <gray>got outplayed by</gray> <white><killer></white><gray>."
  sent-home: "<prefix><white><killer></white> <gray>sent</gray> <white><victim></white> <gray>back to the lobby."
  royal: "<prefix><gold>♛</gold> <white><killer></white> <gray>dethroned</gray> <white><victim></white><gray>."

name: ElotecraftDuels
version: '${version}'
authors: [4ngylo]
description: 1v1 duels with kits, arenas, queues, spectators and stats.

main: me.angylo.elotecraftDuels.ElotecraftDuels
api-version: '1.21.11'
depend: [ElotecraftAPI]
softdepend: [Vault, PlaceholderAPI]

# Commands (/duel, /duels) are registered at runtime by ElotecraftAPI's CommandBuilder.
permissions:
  duels.player:
    description: Every player feature.
    default: true
    children:
      duels.duel: true
      duels.select-arena: true
      duels.queue: true
      duels.queue.ranked: true
      duels.spectate: true
      duels.stats: true
      duels.top: true
  duels.duel:
    description: Send, accept and deny duel requests and rematches.
    default: true
  duels.select-arena:
    description: Choose the arena when challenging someone.
    default: true
  duels.queue:
    description: Join unranked matchmaking queues.
    default: true
  duels.queue.ranked:
    description: Join ranked matchmaking queues, which move the Elo rating.
    default: true
  duels.spectate:
    description: Spectate other players' duels.
    default: true
  duels.stats:
    description: See your own and other players' duel stats.
    default: true
  duels.top:
    description: See the duel leaderboard.
    default: true
  duels.admin:
    description: Use /duels; grants every admin permission below.
    default: op
    children:
      duels.admin.arena: true
      duels.admin.kit: true
      duels.admin.reload: true
      duels.admin.stop: true
      duels.bypass.cooldown: true
  duels.admin.arena:
    description: Create and edit arenas.
    default: op
  duels.admin.kit:
    description: Create and edit kits.
    default: op
  duels.admin.reload:
    description: Reload the config, messages, menus, arenas and kits.
    default: op
  duels.admin.stop:
    description: Stop another player's duel.
    default: op
  duels.bypass.cooldown:
    description: Send duel requests without waiting for the cooldown.
    default: op

# Messages for the /example demo command (MiniMessage format).
# <prefix> works in every message. messages_es.yml overrides keys for Spanish clients.
prefix: "<gradient:gold:yellow><bold>Example</bold></gradient> <dark_gray>» "
example:
  help: "<gold>/example</gold> <gray>menu | pages | roulette | shop | give [amount] | sneak | input | hud | hologram | skull [player] | async | blocks [player] | topblocks | admin cooldown <duration> | admin reload"
  given: "<green>Gave you <amount> demo diamonds. <gray>(total given: <total>)"
  on-cooldown: "<red>Wait <time> before using this again."
  invalid-amount: "<red>Amount must be a number from 1 to 64."
  cooldown-set: "<green>Give cooldown set to <time>."
  invalid-duration: "<red>'<input>' is not a duration. Try 30s, 5m or 1h30m."
  sneak-wait: "<yellow>Sneak within 10 seconds..."
  sneak-done: "<green>Sneak detected!"
  sneak-timeout: "<red>Too slow, stopped listening."
  async-started: "<gray>Working off the main thread..."
  async-done: "<green>Async result: <result> <gray>(back on main thread: <main>)"
  reloaded: "<green>Reloaded messages.yml and example.yml."
  reload-failed: "<red>Reload failed; check the console."
  countdown: "<yellow><seconds>..."
  countdown-done: "<green>Go!"
  invalid-seconds: "<red>Seconds must be a number from 1 to 60."
  roulette-start: "<gold>✦ <yellow>The wheel is spinning... <gray>(closing the menu won't stop it)"
  roulette-busy: "<red>Your roulette is still spinning!"
  roulette-win: "<gold>✦ <gray>You won <prize><gray>!"
  roulette-title: "<gradient:gold:yellow><bold>WINNER!"
  roulette-title-rare: "<gradient:#ff8a00:#e52e71><bold>JACKPOT!"
  roulette-subtitle: "<gray>You won <prize>"
  blocks-header: "<gold>⛏ <white><player></white>'s broken blocks: <yellow><total>"
  blocks-line: "<gray>  • <white><block></white>: <yellow><amount>"
  blocks-unknown: "<gray>No blocks broken by '<white><player></white>' yet."
  blocks-error: "<red>Could not load block stats; check the console."
  top-header: "<gold>⛏ Top miners"
  top-line: "<yellow>#<rank> <white><player> <gray>- <yellow><total>"
  top-empty: "<gray>Nobody has broken any blocks yet."
  roulette-broadcast: "<gold>★ <white><player></white> hit the jackpot and won <prize><gold>! ★"
  input-ask: "<prefix><yellow>Type a nickname in chat (or 'cancel'); you have 30 seconds."
  input-done: "<prefix><green>Nice to meet you, <white><name></white>!"
  input-cancelled: "<prefix><gray>No nickname then."
  hud-shown: "<prefix><green>Sidebar and boss bar shown. Run it again to hide the sidebar."
  hud-hidden: "<prefix><gray>Sidebar hidden."
  hologram-spawned: "<prefix><green>Hologram spawned in front of you; it disappears in 15 seconds."
  skull-given: "<prefix><green>Here is <white><player></white>'s head."
  skull-unknown: "<prefix><red>'<player>' is not online."
